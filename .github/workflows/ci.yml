name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

jobs:
  rust-format:
    name: Rust formatting
    runs-on: ubuntu-latest
    steps:
      # Pinned to v4.3.1 — update process: check https://github.com/actions/checkout/releases
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Format check
        run: cargo fmt --all -- --check

  rust-lint:
    name: Rust clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Lint suppression policy
        run: bash scripts/check_lint_suppressions.sh

  rust-msrv:
    name: MSRV check (Rust 1.80)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.80"
      - name: Check with MSRV toolchain
        run: cargo check -p eggfetch-core --no-default-features --features http1,tls-rustls

  rust-test:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Cache cargo registry and target
        # Pinned to v4.3.0 — update process: check https://github.com/actions/cache/releases
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Build
        run: cargo check --workspace --all-features
      - name: Feature matrix
        run: |
          cargo check -p eggfetch-core --no-default-features
          cargo check -p eggfetch-core --no-default-features --features http1,tls-rustls
          cargo check -p eggfetch-core --all-features
      - name: Tests
        run: cargo test --workspace --exclude eggfetch-python --all-features

  rust-doc:
    name: Rust documentation
    runs-on: ubuntu-latest
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Documentation build
        run: cargo doc --workspace --all-features --no-deps
      - name: Doctests
        run: cargo test --doc -p eggfetch-core --all-features

  docs-syntax:
    name: Documentation syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check Python example syntax
        run: python scripts/check_doc_examples.py
      - name: Check internal links
        run: python scripts/check_doc_links.py
      - name: Generate CLI help reference
        run: python scripts/generate_cli_help.py
      - name: Check API surface
        run: python scripts/check_api_surface.py
      - name: Verify CLI help matches docs
        run: python scripts/verify_cli_help_sync.py

  docs-runtime:
    name: Documentation runtime examples
    runs-on: ubuntu-latest
    needs: [rust-test]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install maturin pytest pytest-asyncio
      - name: Build and install Python package
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        run: maturin develop -m crates/eggfetch-python/Cargo.toml
      - name: Execute Python doc examples
        run: python scripts/run_doc_examples.py

  resource-monitor:
    name: Resource regression check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Build resource monitor
        run: cargo build --release -p eggfetch-bench --bin resource_monitor
      - name: Run resource monitor
        run: ./target/release/resource_monitor | tee resource-report.json
      - name: Check resource thresholds
        run: |
          PASSED=$(python -c "import json; print(json.load(open('resource-report.json'))['passed'])")
          if [ "$PASSED" != "True" ]; then
            echo "::error::Resource regression detected — see resource-report.json"
            exit 1
          fi
          echo "All resource workloads within thresholds."
      - name: Upload resource report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-report
          path: resource-report.json

  python:
    name: Python tests (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache cargo registry and target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-py${{ matrix.python-version }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-cargo-

      - name: Create virtualenv
        run: python -m venv .venv

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f .venv/bin/activate ]; then
            source .venv/bin/activate
          else
            source .venv/Scripts/activate
          fi
          pip install maturin pytest pytest-asyncio

      - name: Build and install
        shell: bash
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        run: |
          if [ -f .venv/bin/activate ]; then
            source .venv/bin/activate
          else
            source .venv/Scripts/activate
          fi
          maturin develop -m crates/eggfetch-python/Cargo.toml

      - name: Python tests
        shell: bash
        run: |
          if [ -f .venv/bin/activate ]; then
            source .venv/bin/activate
          else
            source .venv/Scripts/activate
          fi
          pytest crates/eggfetch-python/tests/ -v

  wheel-smoke:
    name: Wheel smoke (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tooling
        run: python -m pip install maturin

      - name: Build wheel
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        run: maturin build --release --manifest-path crates/eggfetch-python/Cargo.toml --out dist

      - name: Install and smoke-test wheel in a clean environment
        run: python scripts/wheel_smoke.py --wheel-dir dist

  # ──────────────────────────────────────────────────────────────────────
  # Matrix summary
  # ──────────────────────────────────────────────────────────────────────
  matrix-summary:
    name: CI matrix summary
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    needs: [rust-format, rust-lint, rust-msrv, rust-test, rust-doc, docs-syntax, docs-runtime, resource-monitor, python, wheel-smoke]
    steps:
      - name: Generate matrix summary
        run: |
          cat > matrix-summary.json << 'EOF'
          {
            "jobs": {
              "rust-format": "${{ needs.rust-format.result }}",
              "rust-lint": "${{ needs.rust-lint.result }}",
              "rust-msrv": "${{ needs.rust-msrv.result }}",
              "rust-test": "${{ needs.rust-test.result }}",
              "rust-doc": "${{ needs.rust-doc.result }}",
              "docs-syntax": "${{ needs.docs-syntax.result }}",
              "docs-runtime": "${{ needs.docs-runtime.result }}",
              "resource-monitor": "${{ needs.resource-monitor.result }}",
              "python": "${{ needs.python.result }}",
              "wheel-smoke": "${{ needs.wheel-smoke.result }}"
            }
          }
          EOF

          echo "## CI Matrix Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Rust formatting | ${{ needs.rust-format.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rust clippy | ${{ needs.rust-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| MSRV check | ${{ needs.rust-msrv.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rust tests (3 OS) | ${{ needs.rust-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rust documentation | ${{ needs.rust-doc.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docs syntax | ${{ needs.docs-syntax.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docs runtime | ${{ needs.docs-runtime.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Resource monitor | ${{ needs.resource-monitor.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python tests (12 combos) | ${{ needs.python.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Wheel smoke (3 OS) | ${{ needs.wheel-smoke.result }} |" >> $GITHUB_STEP_SUMMARY

          # Check for failures
          FAILED=0
          for result in "${{ needs.rust-format.result }}" "${{ needs.rust-lint.result }}" "${{ needs.rust-msrv.result }}" "${{ needs.rust-test.result }}" "${{ needs.rust-doc.result }}" "${{ needs.docs-syntax.result }}" "${{ needs.docs-runtime.result }}" "${{ needs.resource-monitor.result }}" "${{ needs.python.result }}" "${{ needs.wheel-smoke.result }}"; do
            if [ "$result" = "failure" ]; then
              FAILED=1
              break
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Result: FAILED** — one or more required jobs failed." >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Result: PASSED**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload matrix summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-matrix-summary
          path: matrix-summary.json
