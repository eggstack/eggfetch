name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

jobs:
  rust-format:
    name: Rust formatting
    runs-on: ubuntu-latest
    steps:
      # Pinned to v4.3.1 — update process: check https://github.com/actions/checkout/releases
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Format check
        run: cargo fmt --all -- --check

  rust-lint:
    name: Rust clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Lint suppression policy
        run: bash scripts/check_lint_suppressions.sh

  rust-msrv:
    name: MSRV check (Rust 1.80)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.80"
      - name: Check with MSRV toolchain
        run: cargo check -p eggfetch-core --no-default-features --features http1,tls-rustls

  rust-test:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Cache cargo registry and target
        # Pinned to v4.3.0 — update process: check https://github.com/actions/cache/releases
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Build
        run: cargo check --workspace --all-features
      - name: Feature matrix
        run: |
          cargo check -p eggfetch-core --no-default-features
          cargo check -p eggfetch-core --no-default-features --features http1,tls-rustls
          cargo check -p eggfetch-core --all-features
      - name: Tests
        run: cargo test --workspace --exclude eggfetch-python --all-features

  rust-doc:
    name: Rust documentation
    runs-on: ubuntu-latest
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Documentation build
        run: cargo doc --workspace --all-features --no-deps
      - name: Doctests
        run: cargo test --doc -p eggfetch-core --all-features

  docs-syntax:
    name: Documentation syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check Python example syntax
        run: python scripts/check_doc_examples.py
      - name: Check internal links
        run: python scripts/check_doc_links.py
      - name: Generate CLI help reference
        run: python scripts/generate_cli_help.py
      - name: Check API surface
        run: python scripts/check_api_surface.py
      - name: Verify CLI help matches docs
        run: python scripts/verify_cli_help_sync.py

  docs-runtime:
    name: Documentation runtime examples
    runs-on: ubuntu-latest
    needs: [rust-test]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Create virtual environment
        run: python -m venv .venv
      - name: Install build tooling
        run: .venv/bin/pip install maturin pytest pytest-asyncio
      - name: Build and install Python package
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        run: .venv/bin/maturin develop -m crates/eggfetch-python/Cargo.toml
      - name: Execute Python doc examples
        run: .venv/bin/python scripts/run_doc_examples.py

  resource-monitor:
    name: Resource regression check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Build resource monitor
        run: cargo build --release -p eggfetch-bench --bin resource_monitor
      - name: Run resource monitor
        run: ./target/release/resource_monitor | tee resource-report.json
      - name: Check resource thresholds
        run: |
          PASSED=$(python -c "import json; print(json.load(open('resource-report.json'))['passed'])")
          if [ "$PASSED" != "True" ]; then
            echo "::error::Resource regression detected — see resource-report.json"
            exit 1
          fi
          echo "All resource workloads within thresholds."
      - name: Upload resource report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-report
          path: resource-report.json

  python:
    name: Python tests (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache cargo registry and target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-py${{ matrix.python-version }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-cargo-

      - name: Create virtualenv
        run: python -m venv .venv

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f .venv/bin/activate ]; then
            source .venv/bin/activate
          else
            source .venv/Scripts/activate
          fi
          pip install maturin pytest pytest-asyncio

      - name: Build and install
        shell: bash
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        run: |
          if [ -f .venv/bin/activate ]; then
            source .venv/bin/activate
          else
            source .venv/Scripts/activate
          fi
          maturin develop -m crates/eggfetch-python/Cargo.toml

      - name: Python tests
        shell: bash
        run: |
          if [ -f .venv/bin/activate ]; then
            source .venv/bin/activate
          else
            source .venv/Scripts/activate
          fi
          pytest crates/eggfetch-python/tests/ -v

  wheel-smoke:
    name: Wheel smoke (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tooling
        run: python -m pip install maturin

      - name: Build wheel
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        run: maturin build --release --manifest-path crates/eggfetch-python/Cargo.toml --out dist

      - name: Install and smoke-test wheel in a clean environment
        run: python scripts/wheel_smoke.py --wheel-dir dist

  # ──────────────────────────────────────────────────────────────────────
  # Required CI Gate — fail-closed merge prerequisite
  # ──────────────────────────────────────────────────────────────────────
  required-gate:
    name: Required CI Gate
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [rust-format, rust-lint, rust-msrv, rust-test, rust-doc, docs-syntax, docs-runtime, resource-monitor, python, wheel-smoke]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build gate results JSON
        run: |
          python - <<'PYEOF'
          import json, os

          jobs = [
              ("rust-format",      "${{ needs.rust-format.result }}"),
              ("rust-lint",        "${{ needs.rust-lint.result }}"),
              ("rust-msrv",        "${{ needs.rust-msrv.result }}"),
              ("rust-test",        "${{ needs.rust-test.result }}"),
              ("rust-doc",         "${{ needs.rust-doc.result }}"),
              ("docs-syntax",      "${{ needs.docs-syntax.result }}"),
              ("docs-runtime",     "${{ needs.docs-runtime.result }}"),
              ("resource-monitor", "${{ needs.resource-monitor.result }}"),
              ("python",           "${{ needs.python.result }}"),
              ("wheel-smoke",      "${{ needs.wheel-smoke.result }}"),
          ]

          results = {}
          for name, result in jobs:
              # GitHub interpolates missing results as empty string
              results[name] = result if result else "missing"

          payload = {"results": results}

          with open("/tmp/ci-results.json", "w") as fh:
              json.dump(payload, fh, indent=2)

          # ── Human-readable table to GITHUB_STEP_SUMMARY ──────────────
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a") as fh:
                  fh.write("## Required CI Gate\n\n")
                  fh.write("| Job | Result |\n")
                  fh.write("|-----|--------|\n")
                  display = [
                      ("Rust formatting",      results["rust-format"]),
                      ("Rust clippy",          results["rust-lint"]),
                      ("MSRV check",           results["rust-msrv"]),
                      ("Rust tests (3 OS)",    results["rust-test"]),
                      ("Rust documentation",   results["rust-doc"]),
                      ("Docs syntax",          results["docs-syntax"]),
                      ("Docs runtime",         results["docs-runtime"]),
                      ("Resource monitor",     results["resource-monitor"]),
                      ("Python tests (12)",    results["python"]),
                      ("Wheel smoke (3 OS)",   results["wheel-smoke"]),
                  ]
                  for label, status in display:
                      fh.write(f"| {label} | {status} |\n")

          # ── Console table ────────────────────────────────────────────
          print(f"{'Job':<24} {'Result'}")
          print("-" * 40)
          for label, status in display:
              print(f"{label:<24} {status}")
          PYEOF

      - name: Evaluate CI gate
        run: python scripts/evaluate_ci_gate.py /tmp/ci-results.json

      - name: Upload gate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-gate-results
          path: /tmp/ci-results.json
