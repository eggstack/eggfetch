name: FFI

on:
  push:
    branches: [main]
    paths:
      - 'crates/eggfetch-ffi/**'
      - 'crates/eggfetch-core/**'
  pull_request:
    branches: [main]
    paths:
      - 'crates/eggfetch-ffi/**'
      - 'crates/eggfetch-core/**'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Pinned to v4.3.1 — update process: check https://github.com/actions/checkout/releases
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Cache cargo registry and build
        # Pinned to v4.3.0 — update process: check https://github.com/actions/cache/releases
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ffi-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ffi-${{ runner.os }}-cargo-

      - name: Check (no default features)
        run: cargo check -p eggfetch-ffi --no-default-features

      - name: Check (http1 + tls-rustls)
        run: cargo check -p eggfetch-ffi --no-default-features --features http1,tls-rustls

      - name: Check (all features)
        run: cargo check -p eggfetch-ffi --all-features

      - name: Test (all features)
        run: cargo test -p eggfetch-ffi --all-features

      - name: Clippy
        run: cargo clippy -p eggfetch-ffi --all-targets --all-features -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

  integration:
    name: Integration (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ffi-int-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run full FFI test suite
        run: cargo test -p eggfetch-ffi --all-features

      - name: Build cdylib
        run: cargo build -p eggfetch-ffi --all-features --lib

      - name: Build staticlib
        run: cargo build -p eggfetch-ffi --all-features --lib --target x86_64-unknown-linux-gnu
