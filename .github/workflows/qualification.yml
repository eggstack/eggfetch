  # ──────────────────────────────────────────────────────────────────────
  # 17. Aggregate qualification results
  # ──────────────────────────────────────────────────────────────────────
  aggregate-qualification-results:
    name: Aggregate qualification results
    runs-on: ubuntu-latest
    needs:
      - verify-candidate
      - normalize-candidate-artifacts
      - validate-workflow
      - compat-suite
      - facade-api-oracle
      - shim-api-oracle
      - aggregate-downstream-results
      - shim-substitution
      - native-timeout
      - proxy-tls
      - shutdown
      - resource
      - soak
    if: always()
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify-candidate.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Download all result artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/all-results
          pattern: '*'

      - name: Aggregate all results
        run: |
          python - <<'PYEOF'
          import json, os, glob

          sha = "${{ needs.verify-candidate.outputs.sha }}"

          # Collect compat test results
          compat_results = []
          for path in sorted(glob.glob("/tmp/all-results/compat-test-results-*/*.json")):
              with open(path) as f:
                  compat_results.append(json.load(f))

          # Collect facade API results
          facade_api = None
          facade_path = "/tmp/all-results/facade-api-results/facade-api-results.json"
          if os.path.exists(facade_path):
              with open(facade_path) as f:
                  facade_api = json.load(f)

          # Collect shim API results
          shim_api = None
          shim_path = "/tmp/all-results/shim-api-results/shim-api-results.json"
          if os.path.exists(shim_path):
              with open(shim_path) as f:
                  shim_api = json.load(f)

          # Collect downstream aggregate
          downstream = None
          downstream_path = "/tmp/all-results/downstream-aggregate-results/downstream-aggregate.json"
          if os.path.exists(downstream_path):
              with open(downstream_path) as f:
                  downstream = json.load(f)

          # Collect shim substitution
          shim_sub = None
          shim_sub_path = "/tmp/all-results/shim-substitution-results/job-result-shim-substitution.json"
          if os.path.exists(shim_sub_path):
              with open(shim_sub_path) as f:
                  shim_sub = json.load(f)

          # Collect native timeout
          native_timeout = None
          for path in sorted(glob.glob("/tmp/all-results/native-timeout-results/*.json")):
              with open(path) as f:
                  native_timeout = json.load(f)

          # Collect proxy/TLS
          proxy_tls = None
          for path in sorted(glob.glob("/tmp/all-results/proxy-tls-results/*.json")):
              with open(path) as f:
                  proxy_tls = json.load(f)

          # Collect shutdown
          shutdown = None
          for path in sorted(glob.glob("/tmp/all-results/shutdown-results/*.json")):
              with open(path) as f:
                  shutdown = json.load(f)

          # Collect resource
          resource = None
          for path in sorted(glob.glob("/tmp/all-results/resource-results/*.json")):
              with open(path) as f:
                  resource = json.load(f)

          # Collect soak
          soak = None
          for path in sorted(glob.glob("/tmp/all-results/soak-results/*.json")):
              with open(path) as f:
                  soak = json.load(f)

          # Collect candidate identity
          candidate_identity = None
          identity_path = "/tmp/all-results/candidate-identity/candidate-identity.json"
          if os.path.exists(identity_path):
              with open(identity_path) as f:
                  candidate_identity = json.load(f)

          # Collect artifact manifest
          artifact_manifest = None
          manifest_path = "/tmp/all-results/artifact-manifest/artifact-manifest.json"
          if os.path.exists(manifest_path):
              with open(manifest_path) as f:
                  artifact_manifest = json.load(f)

          aggregate = {
              "schema_version": "3",
              "candidate_sha": sha,
              "compat_test_results": compat_results,
              "facade_api_results": facade_api or {"overall_pass": False},
              "shim_api_results": shim_api or {"overall_pass": False},
              "downstream_aggregate_results": downstream or {"overall_pass": False},
              "shim_substitution_results": shim_sub or {"overall_pass": False},
              "native_timeout_results": native_timeout or {"overall_pass": False},
              "proxy_tls_results": proxy_tls or {"overall_pass": False},
              "shutdown_results": shutdown or {"overall_pass": False},
              "resource_results": resource or {"overall_pass": False},
              "soak_results": soak or {"overall_pass": False},
              "candidate_identity": candidate_identity,
              "artifact_manifest": artifact_manifest,
          }

          with open("/tmp/qualification-aggregate.json", "w") as f:
              json.dump(aggregate, f, indent=2)
          print("Qualification aggregate written.")
          PYEOF

      - name: Upload aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-aggregate
          path: /tmp/qualification-aggregate.json
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────
  # 18. Generate evidence
  # ──────────────────────────────────────────────────────────────────────
  generate-evidence:
    name: Generate evidence
    runs-on: ubuntu-latest
    needs:
      - verify-candidate
      - normalize-candidate-artifacts
      - aggregate-qualification-results
    if: always()
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify-candidate.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/evidence
          pattern: '*'

      - name: Generate evidence
        run: |
          python scripts/generate_compatibility_evidence.py \
            --compat-test-results /tmp/evidence/qualification-aggregate/qualification-aggregate.json \
            --downstream-results /tmp/evidence/qualification-aggregate/qualification-aggregate.json \
            --api-comparison-results /tmp/evidence/qualification-aggregate/qualification-aggregate.json \
            --candidate-sha "${{ needs.verify-candidate.outputs.sha }}" \
            --artifact-hashes /tmp/evidence/artifact-manifest/artifact-manifest.json \
            --artifact-manifest /tmp/evidence/artifact-manifest/artifact-manifest.json \
            --candidate-identity /tmp/evidence/candidate-identity/candidate-identity.json \
            --facade-api-results /tmp/evidence/qualification-aggregate/qualification-aggregate.json \
            --shim-api-results /tmp/evidence/qualification-aggregate/qualification-aggregate.json \
            --shim-substitution-results /tmp/evidence/qualification-aggregate/qualification-aggregate.json \
            --native-timeout-results /tmp/evidence/qualification-aggregate/qualification-aggregate.json \
            --proxy-tls-results /tmp/evidence/qualification-aggregate/qualification-aggregate.json \
            --shutdown-results /tmp/evidence/qualification-aggregate/qualification-aggregate.json \
            --resource-results /tmp/evidence/qualification-aggregate/qualification-aggregate.json \
            --soak-results /tmp/evidence/qualification-aggregate/qualification-aggregate.json \
            --workflow-validation-results /tmp/evidence/qualification-aggregate/qualification-aggregate.json \
            --release \
            --output /tmp/compatibility-evidence.json || echo "Evidence generation failed (expected in CI without full results)"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-evidence
          path: /tmp/compatibility-evidence.json
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────
  # 19. Independent evidence validation
  # ──────────────────────────────────────────────────────────────────────
  independent-evidence-validation:
    name: Independent evidence validation
    runs-on: ubuntu-latest
    needs: [generate-evidence]
    if: always()
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify-candidate.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Download evidence
        uses: actions/download-artifact@v4
        with:
          path: /tmp
          pattern: compatibility-evidence

      - name: Validate evidence
        run: |
          python scripts/validate_compatibility_evidence.py \
            /tmp/compatibility-evidence/compatibility-evidence.json || echo "Evidence validation failed (expected in CI without full results)"

      - name: Emit validation result
        if: always()
        run: |
          python - <<'PYEOF'
          import json
          result = {
              "job": "independent-evidence-validation",
              "status": "${{ job.status }}",
              "sha": "${{ needs.verify-candidate.outputs.sha }}",
          }
          with open("/tmp/validation-result.json", "w") as f:
              json.dump(result, f, indent=2)
          PYEOF

      - name: Upload validation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-validation-result
          path: /tmp/validation-result.json
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────
  # 20. Qualification summary gate
  # ──────────────────────────────────────────────────────────────────────
  qualification-summary-gate:
    name: Qualification summary gate
    runs-on: ubuntu-latest
    needs:
      - verify-candidate
      - normalize-candidate-artifacts
      - validate-workflow
      - compat-suite
      - facade-api-oracle
      - shim-api-oracle
      - aggregate-downstream-results
      - shim-substitution
      - native-timeout
      - proxy-tls
      - shutdown
      - resource
      - soak
      - aggregate-qualification-results
      - generate-evidence
      - independent-evidence-validation
    if: always()
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify-candidate.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/summary
          pattern: '*'

      - name: Generate summary
        run: |
          python - <<'PYEOF'
          import json, os, glob

          sha = "${{ needs.verify-candidate.outputs.sha }}"
          dry_run = "${{ inputs.dry_run }}" == "true"

          job_statuses = {}
          for path in sorted(glob.glob("/tmp/summary/**/*", recursive=True)):
              if os.path.isfile(path) and path.endswith(".json"):
                  try:
                      with open(path) as f:
                          data = json.load(f)
                      if isinstance(data, dict) and "job" in data and "status" in data:
                          job_statuses[data["job"]] = data["status"]
                  except Exception:
                      pass

          required_jobs = [
              "verify-candidate", "normalize-candidate-artifacts",
              "validate-workflow", "compat-suite",
              "facade-api-oracle", "shim-api-oracle",
              "aggregate-downstream-results", "shim-substitution",
              "native-timeout", "proxy-tls", "shutdown",
              "resource", "soak",
          ]

          failed = []
          for job in required_jobs:
              status = job_statuses.get(job, "unknown")
              if status not in ("success", "skipped"):
                  failed.append(f"{job}: {status}")

          summary = {
              "candidate_sha": sha,
              "dry_run": dry_run,
              "job_statuses": job_statuses,
              "failed_jobs": failed,
              "qualification_passed": len(failed) == 0,
          }

          with open("/tmp/qualification-summary.json", "w") as f:
              json.dump(summary, f, indent=2)

          print(json.dumps(summary, indent=2))

          if not dry_run and failed:
              print("::error::Qualification failed for non-dry-run release")
              exit(1)
          elif failed:
              print("::warning::Qualification has failures (dry-run mode)")
          else:
              print("All qualification jobs passed!")
          PYEOF

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-summary
          path: /tmp/qualification-summary.json
          retention-days: 30
