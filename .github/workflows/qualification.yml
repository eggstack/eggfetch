name: Qualification

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Full 40-char SHA of the release candidate"
        required: true
        type: string
      dry_run:
        description: "Dry-run: build and validate but skip publishing"
        required: false
        type: boolean
        default: true
  schedule:
    # Weekly soak run against main
    - cron: "0 3 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

permissions:
  contents: read
  attestations: write
  checks: read

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # 1. Verify candidate SHA has a green Required CI Gate
  # ──────────────────────────────────────────────────────────────────────
  verify-candidate:
    name: Verify candidate
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      verified: ${{ steps.check-gate.outputs.verified }}
      run_url: ${{ steps.check-gate.outputs.run_url }}
      attempt: ${{ steps.check-gate.outputs.attempt }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Resolve candidate SHA
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHA="${{ inputs.candidate_sha }}"
          else
            SHA="${{ github.sha }}"
          fi
          if ! echo "$SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::Invalid SHA: $SHA"
            exit 1
          fi
          if ! git cat-file -e "$SHA" 2>/dev/null; then
            echo "::error::SHA does not exist: $SHA"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Candidate SHA: $SHA"

      - name: Verify Required CI Gate is green
        id: check-gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ steps.resolve.outputs.sha }}"
          REPO="${{ github.repository }}"
          echo "Checking Required CI Gate for $SHA in $REPO..."
          CHECK_RUNS=$(gh api \
            "repos/$REPO/commits/$SHA/check-runs" \
            --jq '.check_runs[] | select(.name == "Required CI Gate")' \
            2>&1) || {
            echo "::error::Failed to query check runs: $CHECK_RUNS"
            echo "verified=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ -z "$CHECK_RUNS" ]; then
            echo "::error::Required CI Gate check not found for SHA $SHA"
            echo "verified=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          STATUS=$(echo "$CHECK_RUNS" | jq -r '.status')
          CONCLUSION=$(echo "$CHECK_RUNS" | jq -r '.conclusion')
          RUN_ID=$(echo "$CHECK_RUNS" | jq -r '.check_suite.id')
          ATTEMPT=$(echo "$CHECK_RUNS" | jq -r '.check_suite.attempt // 1')
          HTML_URL=$(echo "$CHECK_RUNS" | jq -r '.html_url')
          echo "Status: $STATUS, Conclusion: $CONCLUSION, Run ID: $RUN_ID, Attempt: $ATTEMPT"
          if [ "$STATUS" != "completed" ]; then
            echo "::error::Required CI Gate has not completed (status=$STATUS)"
            echo "verified=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::Required CI Gate conclusion is $CONCLUSION (expected success)"
            echo "verified=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Required CI Gate passed for $SHA (attempt $ATTEMPT)"
          echo "verified=true" >> "$GITHUB_OUTPUT"
          echo "run_url=$HTML_URL" >> "$GITHUB_OUTPUT"
          echo "attempt=$ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Fail if verification failed
        if: steps.check-gate.outputs.verified != 'true'
        run: |
          echo "::error::Candidate SHA ${{ steps.resolve.outputs.sha }} does not have a green Required CI Gate"
          exit 1

  # ──────────────────────────────────────────────────────────────────────
  # 2. Build eggfetch wheel and httpx replacement wheel
  # ──────────────────────────────────────────────────────────────────────
  build-candidate-artifacts:
    name: Build candidate artifacts
    runs-on: ubuntu-latest
    needs: [verify-candidate]
    if: needs.verify-candidate.outputs.verified == 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify-candidate.outputs.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: qual-build-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: qual-build-${{ runner.os }}-cargo-

      - name: Build eggfetch wheel
        run: |
          pip install maturin
          maturin build --release \
            --manifest-path crates/eggfetch-python/Cargo.toml \
            --out dist/eggfetch \
            --interpreter 3.10 3.11 3.12 3.13

      - name: Build httpx replacement wheel
        run: |
          pip install build
          python -m build --wheel --outdir dist/httpx-replacement compat/httpx-controlled-replacement

      - name: Upload eggfetch wheel
        uses: actions/upload-artifact@v4
        with:
          name: eggfetch-wheel
          path: dist/eggfetch/*.whl

      - name: Upload httpx replacement wheel
        uses: actions/upload-artifact@v4
        with:
          name: httpx-replacement-wheel
          path: dist/httpx-replacement/*.whl

  # ──────────────────────────────────────────────────────────────────────
  # 3. Normalize candidate artifacts into canonical bundle
  # ──────────────────────────────────────────────────────────────────────
  normalize-candidate-artifacts:
    name: Normalize artifacts
    runs-on: ubuntu-latest
    needs: [build-candidate-artifacts]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify-candidate.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Download eggfetch wheel
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: eggfetch-wheel

      - name: Download httpx replacement wheel
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: httpx-replacement-wheel

      - name: Generate artifact manifest
        run: |
          python scripts/generate_artifact_manifest.py \
            --eggfetch-wheel dist/eggfetch-wheel/*.whl \
            --httpx-replacement-wheel dist/httpx-replacement-wheel/*.whl \
            --candidate-sha "${{ needs.verify-candidate.outputs.sha }}" \
            --workflow-run-url "${{ needs.verify-candidate.outputs.run_url }}" \
            --output /tmp/artifact-manifest.json

      - name: Generate candidate identity
        run: |
          python scripts/candidate_identity.py \
            --candidate-sha "${{ needs.verify-candidate.outputs.sha }}" \
            --workflow-run-url "${{ needs.verify-candidate.outputs.run_url }}" \
            --artifact-manifest /tmp/artifact-manifest.json \
            --output /tmp/candidate-identity.json

      - name: Upload artifact manifest
        uses: actions/upload-artifact@v4
        with:
          name: artifact-manifest
          path: /tmp/artifact-manifest.json

      - name: Upload candidate identity
        uses: actions/upload-artifact@v4
        with:
          name: candidate-identity
          path: /tmp/candidate-identity.json

  # ──────────────────────────────────────────────────────────────────────
  # 4. Validate qualification workflow structure
  # ──────────────────────────────────────────────────────────────────────
  validate-workflow:
    name: Validate workflow structure
    runs-on: ubuntu-latest
    needs: [verify-candidate, normalize-candidate-artifacts]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify-candidate.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Download candidate identity
        uses: actions/download-artifact@v4
        with:
          path: /tmp
          pattern: candidate-identity

      - name: Validate workflow
        run: |
          python scripts/validate_qualification_workflow.py \
            --candidate-identity /tmp/candidate-identity/candidate-identity.json \
            --sha "${{ needs.verify-candidate.outputs.sha }}" \
            --workflow-run-url "${{ needs.verify-candidate.outputs.run_url }}"

  # ──────────────────────────────────────────────────────────────────────
  # 5. HTTPX compatibility test suite
  # ──────────────────────────────────────────────────────────────────────
  compat-suite:
    name: Compat suite (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [verify-candidate, normalize-candidate-artifacts]
    if: needs.verify-candidate.outputs.verified == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify-candidate.outputs.sha }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download eggfetch wheel
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: eggfetch-wheel

      - name: Download candidate identity
        uses: actions/download-artifact@v4
        with:
          path: /tmp
          pattern: candidate-identity

      - name: Create venv and install from wheel
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r compat/qualification-requirements.txt
          pip install -r compat/httpx/0.28.1/requirements.txt
          pip install dist/eggfetch-wheel/*.whl

      - name: Validate compatibility profile
        run: |
          source .venv/bin/activate
          python scripts/validate_httpx_compat_profile.py compat/httpx/0.28.1

      - name: Run compatibility tests
        env:
          EGGFETCH_COMPAT_REQUIRED: "1"
          EGGFETCH_COMPAT_PROFILE: "httpx/0.28.1"
        run: |
          source .venv/bin/activate
          pytest crates/eggfetch-python/tests/compat/ -v --strict-markers --timeout=30 \
            --json-report --json-report-file=/tmp/compat-test-results.json

      - name: Normalize test results
        run: |
          source .venv/bin/activate
          python scripts/normalize_pytest_result.py \
            --input /tmp/compat-test-results.json \
            --candidate-sha "${{ needs.verify-candidate.outputs.sha }}" \
            --identity-digest "$(python -c "import json; print(json.load(open('/tmp/candidate-identity/candidate-identity.json'))['identity_digest'])")" \
            --suite compat \
            --output /tmp/compat-test-results-contract.json

      - name: Upload compat test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-test-results-py${{ matrix.python-version }}
          path: /tmp/compat-test-results-contract.json
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────
  # 6. Facade API oracle
  # ──────────────────────────────────────────────────────────────────────
  facade-api-oracle:
    name: Facade API oracle
    runs-on: ubuntu-latest
    needs: [verify-candidate, normalize-candidate-artifacts]
    if: needs.verify-candidate.outputs.verified == 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify-candidate.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Download eggfetch wheel
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: eggfetch-wheel

      - name: Download candidate identity
        uses: actions/download-artifact@v4
        with:
          path: /tmp
          pattern: candidate-identity

      - name: Create venv and install
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r compat/qualification-requirements.txt
          pip install -r compat/httpx/0.28.1/requirements.txt
          pip install dist/eggfetch-wheel/*.whl

      - name: Generate facade API manifest
        run: |
          source .venv/bin/activate
          python scripts/generate_httpx_api_manifest.py \
            --package eggfetch.compat.httpx \
            --output /tmp/eggfetch-facade-manifest.json

      - name: Compare facade API manifest
        run: |
          source .venv/bin/activate
          python scripts/compare_httpx_api_manifest.py \
            --reference compat/httpx/0.28.1/reference-api.json \
            --candidate /tmp/eggfetch-facade-manifest.json \
            --allowed compat/httpx/0.28.1/allowed-differences.toml \
            --resolved compat/httpx/0.28.1/resolved-differences.toml \
            --artifact-manifest /tmp/candidate-identity/candidate-identity.json \
            --candidate-identity /tmp/candidate-identity/candidate-identity.json \
            --validate \
            --output /tmp/facade-api-results.json

      - name: Upload facade API results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facade-api-results
          path: /tmp/facade-api-results.json
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────
  # 7. Shim API oracle
  # ──────────────────────────────────────────────────────────────────────
  shim-api-oracle:
    name: Shim API oracle
    runs-on: ubuntu-latest
    needs: [verify-candidate, normalize-candidate-artifacts]
    if: needs.verify-candidate.outputs.verified == 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify-candidate.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Download eggfetch wheel
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: eggfetch-wheel

      - name: Download httpx replacement wheel
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: httpx-replacement-wheel

      - name: Download candidate identity
        uses: actions/download-artifact@v4
        with:
          path: /tmp
          pattern: candidate-identity

      - name: Create venv and install shim
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r compat/qualification-requirements.txt
          pip install -r compat/httpx/0.28.1/requirements.txt
          pip install dist/eggfetch-wheel/*.whl
          pip install dist/httpx-replacement-wheel/*.whl

      - name: Generate shim API manifest
        run: |
          source .venv/bin/activate
          python scripts/generate_httpx_api_manifest.py \
            --package httpx \
            --output /tmp/shim-api-manifest.json

      - name: Compare shim API manifest
        run: |
          source .venv/bin/activate
          python scripts/compare_httpx_api_manifest.py \
            --reference compat/httpx/0.28.1/reference-api.json \
            --candidate /tmp/shim-api-manifest.json \
            --allowed compat/httpx/0.28.1/allowed-differences.toml \
            --resolved compat/httpx/0.28.1/resolved-differences.toml \
            --artifact-manifest /tmp/candidate-identity/candidate-identity.json \
            --candidate-identity /tmp/candidate-identity/candidate-identity.json \
            --validate \
            --output /tmp/shim-api-results.json

      - name: Upload shim API results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shim-api-results
          path: /tmp/shim-api-results.json
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────
  # 8. Prepare downstream matrix
  # ──────────────────────────────────────────────────────────────────────
  prepare-downstream-matrix:
    name: Prepare downstream matrix
    runs-on: ubuntu-latest
    needs: [verify-candidate]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify-candidate.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Generate downstream matrix
        run: |
          python scripts/generate_downstream_matrix.py \
            --manifest compat/downstream/manifest.toml \
            --output /tmp/downstream-matrix.json

      - name: Upload downstream matrix
        uses: actions/upload-artifact@v4
        with:
          name: downstream-matrix
          path: /tmp/downstream-matrix.json

  # ──────────────────────────────────────────────────────────────────────
  # 9. Downstream substitution tests (matrix)
  # ──────────────────────────────────────────────────────────────────────
  downstream-substitution:
    name: Downstream (${{ matrix.package }})
    runs-on: ubuntu-latest
    needs: [verify-candidate, normalize-candidate-artifacts, prepare-downstream-matrix]
    if: needs.verify-candidate.outputs.verified == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: httpx
            version: "0.28.1"
            source-locator: "httpx==0.28.1"
            source-hash: "d909fcccc110f8c7faf814ca82a9a4d816bc5a6dbfea25d6591d6985b8ba59ad"
            test-command: "python -m pytest compat/downstream/behavioral_fixtures/test_httpx_contract_behavior.py -v"
            install-command: "pip install httpx==0.28.1"
            timeout: 60
            min-collected: 1
            min-passed: 1
            max-skipped: 0
            max-xfailed: 0
            category-ids: ["contract-tests"]
          - package: respx
            version: "0.23.1"
            source-locator: "respx==0.23.1"
            source-hash: "b18004b029935384bccfa6d7d9d74b4ec9af73a081cc28600fffc0447f4b8c1a"
            test-command: "python -m pytest compat/downstream/behavioral_fixtures/test_respx_behavior.py -v"
            install-command: "pip install respx==0.23.1"
            timeout: 60
            min-collected: 1
            min-passed: 1
            max-skipped: 0
            max-xfailed: 0
            category-ids: ["mock-transport-request-matching"]
          - package: pytest-httpx
            version: "0.36.2"
            source-locator: "pytest-httpx==0.36.2"
            source-hash: "d42ebd5679442dc7bfb0c48e0767b6562e9bc4534d805127b0084171886a5e22"
            test-command: "python -m pytest compat/downstream/behavioral_fixtures/test_pytest_httpx_behavior.py -v"
            install-command: "pip install pytest-httpx==0.36.2"
            timeout: 60
            min-collected: 1
            min-passed: 1
            max-skipped: 0
            max-xfailed: 0
            category-ids: ["framework-test-client"]
          - package: starlette
            version: "0.37.2"
            source-locator: "starlette==0.37.2"
            source-hash: "6fe59f29268538e5d0d182f2791a479a0c64638e6935d1c6989e63fb2699c6ee"
            test-command: "python -m pytest compat/downstream/behavioral_fixtures/test_starlette_behavior.py -v"
            install-command: "pip install starlette==0.37.2"
            timeout: 60
            min-collected: 1
            min-passed: 1
            max-skipped: 0
            max-xfailed: 0
            category-ids: ["asgi-test-client"]
          - package: anthropic
            version: "0.39.0"
            source-locator: "anthropic==0.39.0"
            source-hash: "ea17093ae0ce0e1768b0c46501d6086b5bcd74ff39d68cd2d6396374e9de7c09"
            test-command: "python -m pytest compat/downstream/behavioral_fixtures/test_anthropic_behavior.py -v"
            install-command: "pip install anthropic==0.39.0"
            timeout: 60
            min-collected: 1
            min-passed: 1
            max-skipped: 0
            max-xfailed: 0
            category-ids: ["sdk-async-client"]
          - package: httpx-sse
            version: "0.4.3"
            source-locator: "httpx-sse==0.4.3"
            source-hash: "0ac1c9fe3c0afad2e0ebb25a934a59f4c7823b60792691f779fad2c5568830fc"
            test-command: "python -m pytest compat/downstream/behavioral_fixtures/test_httpx_sse_behavior.py -v"
            install-command: "pip install httpx-sse==0.4.3"
            timeout: 60
            min-collected: 1
            min-passed: 1
            max-skipped: 0
            max-xfailed: 0
            category-ids: ["streaming-sse-consumption"]
          - package: httpx-auth
            version: "0.23.1"
            source-locator: "httpx-auth==0.23.1"
            source-hash: "04f8bd0824efe3d9fb79690cc670b0da98ea809babb7aea04a72f334d4fd5ec5"
            test-command: "python -m pytest compat/downstream/behavioral_fixtures/test_httpx_auth_behavior.py -v"
            install-command: "pip install httpx-auth==0.23.1"
            timeout: 60
            min-collected: 1
            min-passed: 1
            max-skipped: 0
            max-xfailed: 0
            category-ids: ["custom-auth-flow"]
          - package: opentelemetry-instrumentation-httpx
            version: "0.65b0"
            source-locator: "opentelemetry-instrumentation-httpx==0.65b0"
            source-hash: "400f1b78afa4ee2332b5debe58e1ed1b317913d58812c952576be76660aeadb1"
            test-command: "python -m pytest compat/downstream/behavioral_fixtures/test_opentelemetry_behavior.py -v"
            install-command: "pip install opentelemetry-instrumentation-httpx==0.65b0 opentelemetry-sdk==1.44.0"
            timeout: 60
            min-collected: 1
            min-passed: 1
            max-skipped: 0
            max-xfailed: 0
            category-ids: ["event-hooks-instrumentation"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify-candidate.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Download eggfetch wheel
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: eggfetch-wheel

      - name: Download candidate identity
        uses: actions/download-artifact@v4
        with:
          path: /tmp
          pattern: candidate-identity

      - name: Create venv and install
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r compat/qualification-requirements.txt
          pip install -r compat/httpx/0.28.1/requirements.txt
          pip install dist/eggfetch-wheel/*.whl
          ${{ matrix.install-command }}

      - name: Run downstream test
        run: |
          source .venv/bin/activate
          ${{ matrix.test-command }} \
            --json-report --json-report-file=/tmp/downstream-${{ matrix.package }}.json

      - name: Emit downstream result
        if: always()
        run: |
          source .venv/bin/activate
          python - <<'PYEOF'
          import json, sys
          try:
              with open("/tmp/downstream-${{ matrix.package }}.json") as f:
                  raw = json.load(f)
          except Exception:
              raw = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          result = {
              "package": "${{ matrix.package }}",
              "version": "${{ matrix.version }}",
              "source_locator": "${{ matrix.source-locator }}",
              "source_hash": "${{ matrix.source-hash }}",
              "category_ids": ${{ matrix.category-ids }},
              "candidate_sha": "${{ needs.verify-candidate.outputs.sha }}",
              "identity_digest": "$(python -c "import json; print(json.load(open('/tmp/candidate-identity/candidate-identity.json'))['identity_digest'])")",
              "min_collected": ${{ matrix.min-collected }},
              "min_passed": ${{ matrix.min-passed }},
              "max_skipped": ${{ matrix.max-skipped }},
              "max_xfailed": ${{ matrix.max-xfailed }},
              "collected": raw.get("summary", {}).get("total", raw.get("tests", 0)),
              "passed": raw.get("summary", {}).get("passed", raw.get("tests", 0) - raw.get("failures", 0) - raw.get("errors", 0)),
              "failures": raw.get("summary", {}).get("failures", raw.get("failures", 0)),
              "errors": raw.get("summary", {}).get("errors", raw.get("errors", 0)),
              "skipped": raw.get("summary", {}).get("skipped", raw.get("skipped", 0)),
              "xfailed": raw.get("summary", {}).get("xfailed", 0),
              "overall_pass": raw.get("summary", {}).get("failures", raw.get("failures", 0)) == 0 and raw.get("summary", {}).get("errors", raw.get("errors", 0)) == 0 and raw.get("summary", {}).get("total", raw.get("tests", 0)) >= ${{ matrix.min-collected }},
              "status": "${{ job.status }}",
          }
          with open("/tmp/downstream-result-${{ matrix.package }}.json", "w") as f:
              json.dump(result, f, indent=2)
          PYEOF

      - name: Upload downstream result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downstream-result-${{ matrix.package }}
          path: /tmp/downstream-result-${{ matrix.package }}.json
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────
  # 10. Aggregate downstream results
  # ──────────────────────────────────────────────────────────────────────
  aggregate-downstream-results:
    name: Aggregate downstream results
    runs-on: ubuntu-latest
    needs: [verify-candidate, downstream-substitution]
    if: always()
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify-candidate.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Download all downstream results
        uses: actions/download-artifact@v4
        with:
          path: /tmp/downstream-results
          pattern: downstream-result-*

      - name: Aggregate downstream results
        run: |
          python - <<'PYEOF'
          import json, os, glob
          results = []
          for path in sorted(glob.glob("/tmp/downstream-results/downstream-result-*/*.json")):
              with open(path) as f:
                  results.append(json.load(f))
          categories_covered = set()
          all_pass = True
          for r in results:
              for cat in r.get("category_ids", []):
                  categories_covered.add(cat)
              if not r.get("overall_pass"):
                  all_pass = False
          required_categories = {
              "contract-tests", "mock-transport-request-matching",
              "framework-test-client", "asgi-test-client",
              "sdk-async-client", "streaming-sse-consumption",
              "custom-auth-flow", "event-hooks-instrumentation",
          }
          missing = required_categories - categories_covered
          aggregate = {
              "overall_pass": all_pass and len(missing) == 0,
              "results": results,
              "categories_covered": sorted(categories_covered),
              "missing_categories": sorted(missing),
              "candidate_sha": "${{ needs.verify-candidate.outputs.sha }}",
              "total_packages": len(results),
              "passed_packages": sum(1 for r in results if r.get("overall_pass")),
          }
          with open("/tmp/downstream-aggregate.json", "w") as f:
              json.dump(aggregate, f, indent=2)
          print(f"Aggregate: {aggregate['passed_packages']}/{aggregate['total_packages']} packages passed")
          print(f"Categories covered: {len(aggregate['categories_covered'])}/8")
          if missing:
              print(f"Missing categories: {missing}")
          PYEOF

      - name: Upload aggregated results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downstream-aggregate-results
          path: /tmp/downstream-aggregate.json
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────
  # 11. Shim substitution test
  # ──────────────────────────────────────────────────────────────────────
  shim-substitution:
    name: Shim substitution test
    runs-on: ubuntu-latest
    needs: [verify-candidate, build-candidate-artifacts]
    if: needs.verify-candidate.outputs.verified == 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify-candidate.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Download eggfetch wheel
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: eggfetch-wheel

      - name: Download httpx replacement wheel
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: httpx-replacement-wheel

      - name: Build and install shim from wheel
        run: |
          python -m venv /tmp/shim-test-venv
          /tmp/shim-test-venv/bin/pip install dist/eggfetch-wheel/*.whl
          /tmp/shim-test-venv/bin/pip install dist/httpx-replacement-wheel/*.whl

      - name: Verify shim identity
        run: |
          /tmp/shim-test-venv/bin/python compat/httpx-controlled-replacement/verify_identity.py

      - name: Run compat tests with shim
        run: |
          /tmp/shim-test-venv/bin/pip install -r compat/qualification-requirements.txt
          EGGFETCH_COMPAT_REQUIRED=1 /tmp/shim-test-venv/bin/pytest \
            crates/eggfetch-python/tests/compat/ -v --strict-markers --timeout=30

      - name: Emit job result artifact
        if: always()
        run: |
          python - <<'PYEOF'
          import json
          result = {
              "job": "shim-substitution",
              "status": "${{ job.status }}",
              "sha": "${{ needs.verify-candidate.outputs.sha }}",
              "overall_pass": "${{ job.status }}" == "success",
          }
          with open("/tmp/job-result-shim-substitution.json", "w") as f:
              json.dump(result, f, indent=2)
          PYEOF

      - name: Upload job result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shim-substitution-results
          path: /tmp/job-result-shim-substitution.json
          retention-days: 30

