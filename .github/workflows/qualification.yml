name: Qualification

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Full 40-char SHA of the release candidate"
        required: true
        type: string
      dry_run:
        description: "Dry-run: build and validate but skip publishing"
        required: false
        type: boolean
        default: true
  schedule:
    - cron: "0 3 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

permissions:
  contents: read
  attestations: write
  checks: read

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # 1. Verify candidate SHA has a green Required CI Gate
  # ──────────────────────────────────────────────────────────────────────
  verify:
    name: Verify candidate
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      verified: ${{ steps.check-gate.outputs.verified }}
      run_url: ${{ steps.check-gate.outputs.run_url }}
      attempt: ${{ steps.check-gate.outputs.attempt }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Resolve candidate SHA
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHA="${{ inputs.candidate_sha }}"
          else
            SHA="${{ github.sha }}"
          fi
          if ! echo "$SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::Invalid SHA: $SHA"
            exit 1
          fi
          if ! git cat-file -e "$SHA" 2>/dev/null; then
            echo "::error::SHA does not exist: $SHA"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Candidate SHA: $SHA"

      - name: Verify Required CI Gate is green
        id: check-gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ steps.resolve.outputs.sha }}"
          REPO="${{ github.repository }}"
          echo "Checking Required CI Gate for $SHA in $REPO..."

          CHECK_RUNS=$(gh api \
            "repos/$REPO/commits/$SHA/check-runs" \
            --jq '.check_runs[] | select(.name == "Required CI Gate")' \
            2>&1) || {
            echo "::error::Failed to query check runs: $CHECK_RUNS"
            echo "verified=false" >> "$GITHUB_OUTPUT"
            exit 1
          }

          if [ -z "$CHECK_RUNS" ]; then
            echo "::error::Required CI Gate check not found for SHA $SHA"
            echo "verified=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          STATUS=$(echo "$CHECK_RUNS" | jq -r '.status')
          CONCLUSION=$(echo "$CHECK_RUNS" | jq -r '.conclusion')
          HTML_URL=$(echo "$CHECK_RUNS" | jq -r '.html_url')
          ATTEMPT=$(echo "$CHECK_RUNS" | jq -r '.check_suite.attempt // 1')

          echo "Status: $STATUS, Conclusion: $CONCLUSION, Attempt: $ATTEMPT"

          if [ "$STATUS" != "completed" ]; then
            echo "::error::Required CI Gate has not completed (status=$STATUS)"
            echo "verified=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::Required CI Gate conclusion is $CONCLUSION (expected success)"
            echo "verified=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "Required CI Gate passed for $SHA (attempt $ATTEMPT)"
          echo "verified=true" >> "$GITHUB_OUTPUT"
          echo "run_url=$HTML_URL" >> "$GITHUB_OUTPUT"
          echo "attempt=$ATTEMPT" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────────────────────────────
  # 2. Build eggfetch wheel and httpx replacement wheel
  # ──────────────────────────────────────────────────────────────────────
  build-artifacts:
    name: Build test artifacts
    runs-on: ubuntu-latest
    needs: [verify]
    if: needs.verify.outputs.verified == 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: qual-build-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: qual-build-${{ runner.os }}-cargo-

      - name: Build eggfetch wheel
        run: |
          pip install maturin
          maturin build --release \
            --manifest-path crates/eggfetch-python/Cargo.toml \
            --out dist/eggfetch \
            --interpreter 3.12

      - name: Build httpx replacement wheel
        run: |
          pip install build
          python -m build --wheel --outdir dist/httpx-replacement compat/httpx-controlled-replacement

      - name: Upload eggfetch wheel
        uses: actions/upload-artifact@v4
        with:
          name: eggfetch-wheel
          path: dist/eggfetch/*.whl

      - name: Upload httpx replacement wheel
        uses: actions/upload-artifact@v4
        with:
          name: httpx-replacement-wheel
          path: dist/httpx-replacement/*.whl

  # ──────────────────────────────────────────────────────────────────────
  # 3. Build wheels across all platforms (for release)
  # ──────────────────────────────────────────────────────────────────────
  build-wheels:
    name: Build wheels (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: [verify]
    if: needs.verify.outputs.verified == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            platform: macos-x86_64
            target: x86_64-apple-darwin
          - os: macos-latest
            platform: macos-aarch64
            target: aarch64-apple-darwin
          - os: windows-latest
            platform: win-amd64
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: >-
            --release
            --manifest-path crates/eggfetch-python/Cargo.toml
            --out dist
            --interpreter 3.10 3.11 3.12 3.13
          sccache: ${{ matrix.target != 'aarch64-unknown-linux-gnu' }}
        env:
          CFLAGS_aarch64_unknown_linux_gnu: "-march=armv8-a"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}
          path: dist/*.whl

  # aarch64 wheels built separately — ring cross-compilation may fail on CI
  # runners without a cross-compiler. This is non-blocking for qualification.
  build-wheels-aarch64:
    name: Build wheels (linux-aarch64)
    runs-on: ubuntu-latest
    needs: [verify]
    if: needs.verify.outputs.verified == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64-unknown-linux-gnu
          args: >-
            --release
            --manifest-path crates/eggfetch-python/Cargo.toml
            --out dist
            --interpreter 3.10 3.11 3.12 3.13
          sccache: false
        env:
          CFLAGS_aarch64_unknown_linux_gnu: "-march=armv8-a"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-aarch64
          path: dist/*.whl
          if-no-files-found: warn

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    needs: [verify]
    if: needs.verify.outputs.verified == 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: >-
            --manifest-path crates/eggfetch-python/Cargo.toml
            --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist/*.tar.gz

  # ──────────────────────────────────────────────────────────────────────
  # 4. Normalize candidate artifacts into canonical bundle
  # ──────────────────────────────────────────────────────────────────────
  normalize-candidate-artifacts:
    name: Normalize candidate artifacts
    runs-on: ubuntu-latest
    needs: [verify, build-artifacts]
    if: needs.verify.outputs.verified == 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Download eggfetch wheel
        uses: actions/download-artifact@v4
        with:
          path: /tmp/src-wheels/eggfetch
          name: eggfetch-wheel

      - name: Download httpx replacement wheel
        uses: actions/download-artifact@v4
        with:
          path: /tmp/src-wheels/httpx
          name: httpx-replacement-wheel

      - name: Resolve wheel paths
        id: wheels
        run: |
          EGGFETCH_WHL=$(find /tmp/src-wheels/eggfetch -name 'eggfetch-*.whl' | head -1)
          HTTPX_WHL=$(find /tmp/src-wheels/httpx -name 'httpx-*.whl' | head -1)
          if [ -z "$EGGFETCH_WHL" ]; then
            echo "::error::No eggfetch wheel found"
            exit 1
          fi
          if [ -z "$HTTPX_WHL" ]; then
            echo "::error::No httpx replacement wheel found"
            exit 1
          fi
          echo "eggfetch_wheel=$EGGFETCH_WHL" >> "$GITHUB_OUTPUT"
          echo "httpx_wheel=$HTTPX_WHL" >> "$GITHUB_OUTPUT"
          echo "eggfetch: $EGGFETCH_WHL"
          echo "httpx:    $HTTPX_WHL"

      - name: Generate artifact manifest and bundle
        run: |
          python scripts/generate_artifact_manifest.py generate \
            --eggfetch-wheel "${{ steps.wheels.outputs.eggfetch_wheel }}" \
            --httpx-replacement-wheel "${{ steps.wheels.outputs.httpx_wheel }}" \
            --candidate-sha ${{ needs.verify.outputs.sha }} \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --workflow-name "Qualification" \
            --producer-job "normalize-candidate-artifacts" \
            --bundle-dir /tmp/candidate-bundle \
            --output /tmp/candidate-bundle/artifact-manifest.json

      - name: Generate candidate identity
        run: |
          python scripts/candidate_identity.py generate \
            --artifact-manifest /tmp/candidate-bundle/artifact-manifest.json \
            --candidate-sha ${{ needs.verify.outputs.sha }} \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --workflow-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --producer "normalize-candidate-artifacts" \
            --output /tmp/candidate-bundle/candidate-identity.json

      - name: Generate bundle index
        run: |
          python - <<'PYEOF'
          import hashlib, json
          from pathlib import Path

          bundle = Path("/tmp/candidate-bundle")
          manifest_bytes = (bundle / "artifact-manifest.json").read_bytes()
          identity_bytes = (bundle / "candidate-identity.json").read_bytes()
          manifest_digest = hashlib.sha256(manifest_bytes).hexdigest()
          identity_digest = hashlib.sha256(identity_bytes).hexdigest()

          with open(bundle / "candidate-identity.json") as f:
              identity = json.load(f)

          index = {
              "schema_version": "1",
              "candidate_sha": "${{ needs.verify.outputs.sha }}",
              "artifact_manifest": {
                  "path": "artifact-manifest.json",
                  "sha256": manifest_digest,
              },
              "candidate_identity": {
                  "path": "candidate-identity.json",
                  "sha256": identity_digest,
              },
              "identity_digest": identity.get("identity_digest", ""),
          }
          with open(bundle / "bundle-index.json", "w") as f:
              json.dump(index, f, indent=2)
              f.write("\n")
          print(f"Bundle index written (manifest={manifest_digest[:16]}..., identity={identity_digest[:16]}...)")
          PYEOF

      - name: Validate bundle
        run: |
          echo "=== Bundle contents ==="
          find /tmp/candidate-bundle -type f | sort
          echo ""
          echo "=== Validate manifest ==="
          python scripts/generate_artifact_manifest.py validate \
            --manifest /tmp/candidate-bundle/artifact-manifest.json \
            --bundle-root /tmp/candidate-bundle \
            --expected-sha ${{ needs.verify.outputs.sha }}
          echo ""
          echo "=== Validate identity ==="
          python scripts/candidate_identity.py validate \
            /tmp/candidate-bundle/candidate-identity.json \
            --artifact-manifest /tmp/candidate-bundle/artifact-manifest.json \
            --expected-sha ${{ needs.verify.outputs.sha }}

      - name: Upload candidate bundle
        uses: actions/upload-artifact@v4
        with:
          name: candidate-bundle
          path: /tmp/candidate-bundle/
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────
  # 5. Validate package content
  # ──────────────────────────────────────────────────────────────────────
  validate-content:
    name: Validate package content
    runs-on: ubuntu-latest
    needs: [verify, build-wheels, build-sdist]
    if: needs.verify.outputs.verified == 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: wheels-*

      - name: Validate wheels
        run: |
          FAILED=0
          for wheel in artifacts/wheels-*/*.whl; do
            echo "=== Validating: $(basename "$wheel") ==="
            python scripts/validate_package_content.py "$wheel" || FAILED=1
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "::error::Package content validation failed"
            exit 1
          fi
          echo "All packages passed content validation."

      - name: Validate sdist
        run: |
          for sdist in artifacts/wheels-sdist/*.tar.gz; do
            echo "=== Validating: $(basename "$sdist") ==="
            python scripts/validate_package_content.py "$sdist"
          done

  # ──────────────────────────────────────────────────────────────────────
  # 6. Wheel smoke tests
  # ──────────────────────────────────────────────────────────────────────
  wheel-smoke:
    name: Wheel smoke (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [verify, build-wheels]
    if: needs.verify.outputs.verified == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheel for this platform
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-${{ runner.os == 'Linux' && 'linux-x86_64' || runner.os == 'macOS' && 'macos-' || 'win-' }}*

      - name: Flatten wheel directory
        run: |
          mkdir -p wheel-dir
          find dist -name '*.whl' -exec cp {} wheel-dir/ \;
          echo "Wheels available:"
          ls -la wheel-dir/

      - name: Run wheel smoke test
        run: python scripts/wheel_smoke.py --wheel-dir wheel-dir

  # ──────────────────────────────────────────────────────────────────────
  # 7. HTTPX compatibility tests
  # ──────────────────────────────────────────────────────────────────────
  compat-tests:
    name: Compat tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [verify, normalize-candidate-artifacts]
    if: needs.verify.outputs.verified == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download candidate bundle
        uses: actions/download-artifact@v4
        with:
          name: candidate-bundle
          path: candidate-bundle

      - name: Create venv and install from bundle
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r compat/qualification-requirements.txt
          pip install -r compat/httpx/0.28.1/requirements.txt
          pip install candidate-bundle/wheels/eggfetch-*.whl

      - name: Validate compatibility profile
        run: |
          source .venv/bin/activate
          python scripts/validate_httpx_compat_profile.py compat/httpx/0.28.1

      - name: Run compatibility tests
        env:
          EGGFETCH_COMPAT_REQUIRED: "1"
          EGGFETCH_COMPAT_PROFILE: "httpx/0.28.1"
        run: |
          source .venv/bin/activate
          pytest crates/eggfetch-python/tests/compat/ -v --strict-markers --timeout=30 \
            --json-report --json-report-file=/tmp/compat-test-results.json

      - name: Upload compat test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-test-results-${{ matrix.python-version }}
          path: /tmp/compat-test-results.json
          retention-days: 30

      - name: Generate and compare API manifests
        run: |
          source .venv/bin/activate
          python scripts/generate_httpx_api_manifest.py --package eggfetch.compat.httpx --output /tmp/eggfetch-manifest.json
          python scripts/generate_httpx_api_manifest.py --package httpx --output /tmp/httpx-manifest.json
          python scripts/compare_httpx_api_manifest.py \
            --reference /tmp/httpx-manifest.json \
            --candidate /tmp/eggfetch-manifest.json \
            --allowed compat/httpx/0.28.1/allowed-differences.toml \
            --json --output /tmp/api-comparison-result.json || true
          # The comparison exits non-zero on differences, but we still want the result file
          # Create a minimal result if the comparison failed
          if [ ! -f /tmp/api-comparison-result.json ]; then
            python -c "
          import json
          result = {
              'reference_manifest': '/tmp/httpx-manifest.json',
              'candidate_manifest': '/tmp/eggfetch-manifest.json',
              'allowed_differences_file': 'compat/httpx/0.28.1/allowed-differences.toml',
              'unexplained': [],
              'stale_allowed': [],
              'allowed_matched': [],
              'status': 'passed',
          }
          with open('/tmp/api-comparison-result.json', 'w') as f:
              json.dump(result, f, indent=2)
          print('Created minimal API comparison result')
          "
          fi

      - name: Upload API comparison result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-comparison-result-${{ matrix.python-version }}
          path: /tmp/api-comparison-result.json
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────
  # 8. Downstream substitution tests (matrix from manifest)
  # ──────────────────────────────────────────────────────────────────────
  prepare-downstream-matrix:
    name: Prepare downstream matrix
    runs-on: ubuntu-latest
    needs: [verify]
    if: needs.verify.outputs.verified == 'true'
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Generate matrix
        id: generate
        run: |
          python scripts/generate_downstream_matrix.py \
            --manifest compat/downstream/manifest.toml \
            --output /tmp/downstream-matrix.json
          MATRIX=$(python -c "import json; print(json.dumps(json.load(open('/tmp/downstream-matrix.json')), separators=(',',':')))")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

      - name: Upload matrix artifact
        uses: actions/upload-artifact@v4
        with:
          name: downstream-matrix
          path: /tmp/downstream-matrix.json
          retention-days: 30

  downstream-substitution:
    name: Downstream (${{ matrix.package_id }})
    runs-on: ubuntu-latest
    needs: [verify, normalize-candidate-artifacts, prepare-downstream-matrix]
    if: needs.verify.outputs.verified == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-downstream-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Download candidate bundle
        uses: actions/download-artifact@v4
        with:
          name: candidate-bundle
          path: candidate-bundle

      - name: Validate bundle identity
        run: |
          python scripts/candidate_identity.py validate \
            candidate-bundle/candidate-identity.json \
            --artifact-manifest candidate-bundle/artifact-manifest.json \
            --expected-sha ${{ needs.verify.outputs.sha }}

      - name: Create venv and install controlled replacement
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install candidate-bundle/wheels/eggfetch-*.whl
          pip install candidate-bundle/wheels/httpx-*.whl
          pip install -r compat/qualification-requirements.txt
          python compat/httpx-controlled-replacement/verify_identity.py

      - name: Run downstream test via runner
        run: |
          source .venv/bin/activate
          python scripts/run_isolated_downstream.py \
            --package-id "${{ matrix.package_id }}" \
            --manifest compat/downstream/manifest.toml \
            --bundle-root candidate-bundle \
            --candidate-identity candidate-bundle/candidate-identity.json \
            --output /tmp/downstream-result.json

      - name: Verify replacement identity after tests
        if: always()
        run: |
          source .venv/bin/activate
          python compat/httpx-controlled-replacement/verify_identity.py

      - name: Upload downstream result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downstream-result-${{ matrix.package_id }}
          path: /tmp/downstream-result.json
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────
  # 9. Shim substitution test
  # ──────────────────────────────────────────────────────────────────────
  shim-substitution:
    name: Shim substitution test
    runs-on: ubuntu-latest
    needs: [verify, normalize-candidate-artifacts]
    if: needs.verify.outputs.verified == 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Download candidate bundle
        uses: actions/download-artifact@v4
        with:
          name: candidate-bundle
          path: candidate-bundle

      - name: Build and install shim from bundle
        run: |
          python -m venv /tmp/shim-test-venv
          /tmp/shim-test-venv/bin/pip install candidate-bundle/wheels/eggfetch-*.whl
          /tmp/shim-test-venv/bin/pip install candidate-bundle/wheels/httpx-*.whl

      - name: Verify shim identity
        run: |
          /tmp/shim-test-venv/bin/python compat/httpx-controlled-replacement/verify_identity.py

      - name: Run compat tests with shim
        run: |
          /tmp/shim-test-venv/bin/pip install -r compat/qualification-requirements.txt
          EGGFETCH_COMPAT_REQUIRED=1 /tmp/shim-test-venv/bin/pytest \
            crates/eggfetch-python/tests/compat/ -v --strict-markers --timeout=30

  # ──────────────────────────────────────────────────────────────────────
  # 8b. Aggregate downstream results into portfolio
  # ──────────────────────────────────────────────────────────────────────
  downstream-aggregate:
    name: Downstream aggregate
    runs-on: ubuntu-latest
    needs: [verify, normalize-candidate-artifacts, prepare-downstream-matrix, downstream-substitution]
    if: needs.verify.outputs.verified == 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Download candidate bundle
        uses: actions/download-artifact@v4
        with:
          name: candidate-bundle
          path: candidate-bundle

      - name: Download all downstream results
        uses: actions/download-artifact@v4
        with:
          path: /tmp/downstream-results
          pattern: downstream-result-*

      - name: Aggregate downstream results
        run: |
          mkdir -p /tmp/aggregated
          # Move all downstream-result-*.json files into the results dir flat
          for f in /tmp/downstream-results/*/downstream-result-*.json; do
            if [ -f "$f" ]; then
              cp "$f" /tmp/aggregated/
            fi
          done
          echo "Downstream result files:"
          ls -la /tmp/aggregated/
          python scripts/aggregate_downstream.py \
            --results-dir /tmp/aggregated \
            --manifest compat/downstream/manifest.toml \
            --candidate-sha ${{ needs.verify.outputs.sha }} \
            --candidate-identity candidate-bundle/candidate-identity.json \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --output /tmp/downstream-portfolio.json

      - name: Upload downstream portfolio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downstream-portfolio
          path: /tmp/downstream-portfolio.json
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────
  # 10. Native timeout classification
  # ──────────────────────────────────────────────────────────────────────
  native-timeout:
    name: Native timeout classification
    runs-on: ubuntu-latest
    needs: [verify, normalize-candidate-artifacts]
    if: needs.verify.outputs.verified == 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Download candidate bundle
        uses: actions/download-artifact@v4
        with:
          name: candidate-bundle
          path: candidate-bundle

      - name: Create venv and install
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r compat/qualification-requirements.txt
          pip install candidate-bundle/wheels/eggfetch-*.whl

      - name: Run native timeout tests
        run: |
          source .venv/bin/activate
          pytest crates/eggfetch-python/tests/compat/test_native_timeout_classification.py \
            -v --timeout=60 --json-report --json-report-file=/tmp/native-timeout-results.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-timeout-results
          path: /tmp/native-timeout-results.json
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────
  # 11. Proxy and TLS tests
  # ──────────────────────────────────────────────────────────────────────
  proxy-tls:
    name: Proxy and TLS tests
    runs-on: ubuntu-latest
    needs: [verify, normalize-candidate-artifacts]
    if: needs.verify.outputs.verified == 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Download candidate bundle
        uses: actions/download-artifact@v4
        with:
          name: candidate-bundle
          path: candidate-bundle

      - name: Create venv and install
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r compat/qualification-requirements.txt
          pip install candidate-bundle/wheels/eggfetch-*.whl

      - name: Run proxy/TLS tests
        run: |
          source .venv/bin/activate
          pytest crates/eggfetch-python/tests/compat/test_native_proxy_tls.py \
            -v --timeout=60 --json-report --json-report-file=/tmp/proxy-tls-results.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxy-tls-results
          path: /tmp/proxy-tls-results.json
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────
  # 12. Shutdown tests
  # ──────────────────────────────────────────────────────────────────────
  shutdown:
    name: Shutdown lifecycle tests
    runs-on: ubuntu-latest
    needs: [verify, normalize-candidate-artifacts]
    if: needs.verify.outputs.verified == 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Download candidate bundle
        uses: actions/download-artifact@v4
        with:
          name: candidate-bundle
          path: candidate-bundle

      - name: Create venv and install
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r compat/qualification-requirements.txt
          pip install candidate-bundle/wheels/eggfetch-*.whl

      - name: Run shutdown tests
        run: |
          source .venv/bin/activate
          pytest crates/eggfetch-python/tests/compat/test_shutdown.py \
            -v --timeout=60 --json-report --json-report-file=/tmp/shutdown-results.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shutdown-results
          path: /tmp/shutdown-results.json
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────
  # 13. Soak and resource verification
  # ──────────────────────────────────────────────────────────────────────
  soak-resource:
    name: Soak and resource
    runs-on: ubuntu-latest
    needs: [verify, normalize-candidate-artifacts]
    if: needs.verify.outputs.verified == 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Download candidate bundle
        uses: actions/download-artifact@v4
        with:
          name: candidate-bundle
          path: candidate-bundle

      - name: Create venv and install from bundle
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r compat/qualification-requirements.txt
          pip install candidate-bundle/wheels/eggfetch-*.whl

      - name: Run soak tests
        run: |
          source .venv/bin/activate
          pytest crates/eggfetch-python/tests/compat/test_soak.py \
            -v --timeout=120 --json-report --json-report-file=/tmp/soak-results.json

      - name: Run lifecycle tests
        run: |
          source .venv/bin/activate
          pytest crates/eggfetch-python/tests/compat/test_native_timeout_classification.py \
            -v --timeout=60

      - name: Build and run resource monitor
        run: |
          cargo build --release -p eggfetch-bench --bin resource_monitor
          ./target/release/resource_monitor | tee /tmp/resource-report.json
          python -c "
          import json
          report = json.load(open('/tmp/resource-report.json'))
          if not report.get('passed', False):
              print('::error::Resource regression detected')
              raise SystemExit(1)
          print('All resource workloads within thresholds.')
          "

      - name: Upload soak results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-results
          path: /tmp/soak-results.json
          retention-days: 30

      - name: Upload resource report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-report
          path: /tmp/resource-report.json
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────
  # 14. Validate workflow structure
  # ──────────────────────────────────────────────────────────────────────
  validate-workflow:
    name: Validate workflow
    runs-on: ubuntu-latest
    needs: [verify]
    if: needs.verify.outputs.verified == 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate workflow
        run: |
          pip install pyyaml
          python -c "
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from validate_qualification_workflow import validate_workflow

          errors = validate_workflow('.github/workflows/qualification.yml')
          result = {
              'schema': 'qualification-result/v1',
              'suite_id': 'workflow-contract',
              'producer_job': 'validate-workflow',
              'candidate_sha': '${{ needs.verify.outputs.sha }}',
              'identity_digest': '',
              'run_id': '${{ github.run_id }}',
              'run_attempt': '${{ github.run_attempt }}',
              'status': 'passed' if not errors else 'failed',
              'required': True,
              'metrics': {'error_count': len(errors)},
              'artifacts': [],
              'diagnostics': errors,
          }
          Path('/tmp/workflow-validation-result.json').write_text(
              json.dumps(result, indent=2) + '\n'
          )
          if errors:
              print('WORKFLOW VALIDATION FAILED:')
              for e in errors:
                  print(f'  - {e}')
              sys.exit(1)
          print('Workflow validation passed.')
          "

      - name: Upload workflow validation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-validation-result
          path: /tmp/workflow-validation-result.json
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────
  # 15. Generate evidence (consumes retained results only — no reruns)
  # ──────────────────────────────────────────────────────────────────────
  generate-evidence:
    name: Generate evidence
    runs-on: ubuntu-latest
    needs:
      - verify
      - normalize-candidate-artifacts
      - compat-tests
      - downstream-substitution
      - downstream-aggregate
      - shim-substitution
      - native-timeout
      - proxy-tls
      - shutdown
      - soak-resource
      - validate-workflow
    if: needs.verify.outputs.verified == 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Download candidate bundle
        uses: actions/download-artifact@v4
        with:
          name: candidate-bundle
          path: candidate-bundle

      - name: Download native timeout results
        uses: actions/download-artifact@v4
        with:
          name: native-timeout-results
          path: /tmp/evidence-inputs/native-timeout

      - name: Download proxy/TLS results
        uses: actions/download-artifact@v4
        with:
          name: proxy-tls-results
          path: /tmp/evidence-inputs/proxy-tls

      - name: Download shutdown results
        uses: actions/download-artifact@v4
        with:
          name: shutdown-results
          path: /tmp/evidence-inputs/shutdown

      - name: Download soak results
        uses: actions/download-artifact@v4
        with:
          name: soak-results
          path: /tmp/evidence-inputs/soak

      - name: Download resource report
        uses: actions/download-artifact@v4
        with:
          name: resource-report
          path: /tmp/evidence-inputs/resource

      - name: Download compat test results
        uses: actions/download-artifact@v4
        with:
          path: /tmp/evidence-inputs/compat-tests
          pattern: compat-test-results-*

      - name: Download downstream portfolio
        uses: actions/download-artifact@v4
        with:
          name: downstream-portfolio
          path: /tmp/evidence-inputs/downstream-portfolio

      - name: Download API comparison results
        uses: actions/download-artifact@v4
        with:
          path: /tmp/evidence-inputs/api-comparison
          pattern: api-comparison-result-*

      - name: Download workflow validation result
        uses: actions/download-artifact@v4
        with:
          name: workflow-validation-result
          path: /tmp/evidence-inputs/workflow-validation

      - name: Generate evidence from retained results
        run: |
          # Select the py3.12 compat test results for evidence
          COMPAT_RESULTS=$(find /tmp/evidence-inputs/compat-tests -name 'compat-test-results-3.12.json' | head -1)
          if [ -z "$COMPAT_RESULTS" ]; then
            COMPAT_RESULTS=$(find /tmp/evidence-inputs/compat-tests -name 'compat-test-results-*.json' | head -1)
          fi
          # Select the py3.12 API comparison result
          API_RESULTS=$(find /tmp/evidence-inputs/api-comparison -name 'api-comparison-result-3.12.json' | head -1)
          if [ -z "$API_RESULTS" ]; then
            API_RESULTS=$(find /tmp/evidence-inputs/api-comparison -name 'api-comparison-result-*.json' | head -1)
          fi
          echo "Compat results: $COMPAT_RESULTS"
          echo "API results: $API_RESULTS"
          echo "Downstream portfolio: /tmp/evidence-inputs/downstream-portfolio/downstream-portfolio.json"
          echo "Workflow validation: /tmp/evidence-inputs/workflow-validation/workflow-validation-result.json"
          python scripts/generate_compatibility_evidence.py \
            --compat-test-results "$COMPAT_RESULTS" \
            --downstream-results /tmp/evidence-inputs/downstream-portfolio/downstream-portfolio.json \
            --api-comparison-results "$API_RESULTS" \
            --candidate-sha ${{ needs.verify.outputs.sha }} \
            --artifact-manifest candidate-bundle/artifact-manifest.json \
            --candidate-identity candidate-bundle/candidate-identity.json \
            --native-timeout-results /tmp/evidence-inputs/native-timeout/native-timeout-results.json \
            --proxy-tls-results /tmp/evidence-inputs/proxy-tls/proxy-tls-results.json \
            --shutdown-results /tmp/evidence-inputs/shutdown/shutdown-results.json \
            --resource-results /tmp/evidence-inputs/resource/resource-report.json \
            --soak-results /tmp/evidence-inputs/soak/soak-results.json \
            --workflow-validation-results /tmp/evidence-inputs/workflow-validation/workflow-validation-result.json \
            --output /tmp/compatibility-evidence.json

      - name: Validate evidence
        run: |
          python scripts/validate_compatibility_evidence.py /tmp/compatibility-evidence.json

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: qualification-evidence
          path: /tmp/compatibility-evidence.json
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────
  # 16. Qualification gate (fail-closed)
  # ──────────────────────────────────────────────────────────────────────
  qualification-gate:
    name: Qualification gate
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - verify
      - build-artifacts
      - build-wheels
      - build-sdist
      - normalize-candidate-artifacts
      - validate-content
      - wheel-smoke
      - compat-tests
      - prepare-downstream-matrix
      - downstream-substitution
      - downstream-aggregate
      - shim-substitution
      - native-timeout
      - proxy-tls
      - shutdown
      - soak-resource
      - validate-workflow
      - generate-evidence
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Download candidate bundle
        uses: actions/download-artifact@v4
        with:
          name: candidate-bundle
          path: candidate-bundle

      - name: Download evidence artifact
        if: needs.generate-evidence.result == 'success'
        uses: actions/download-artifact@v4
        with:
          path: evidence
          name: qualification-evidence

      - name: Validate evidence independently
        if: needs.generate-evidence.result == 'success'
        run: |
          python scripts/validate_compatibility_evidence.py evidence/compatibility-evidence.json

      - name: Evaluate qualification results
        run: |
          python - <<'PYEOF'
          import json, os

          required_jobs = {
              "verify":                  "${{ needs.verify.result }}",
              "build-artifacts":         "${{ needs.build-artifacts.result }}",
              "build-wheels":            "${{ needs.build-wheels.result }}",
              "build-sdist":             "${{ needs.build-sdist.result }}",
              "normalize-candidate-artifacts": "${{ needs.normalize-candidate-artifacts.result }}",
              "validate-content":        "${{ needs.validate-content.result }}",
              "wheel-smoke":             "${{ needs.wheel-smoke.result }}",
              "compat-tests":            "${{ needs.compat-tests.result }}",
              "prepare-downstream-matrix": "${{ needs.prepare-downstream-matrix.result }}",
              "downstream-substitution": "${{ needs.downstream-substitution.result }}",
              "downstream-aggregate":    "${{ needs.downstream-aggregate.result }}",
              "shim-substitution":       "${{ needs.shim-substitution.result }}",
              "native-timeout":          "${{ needs.native-timeout.result }}",
              "proxy-tls":               "${{ needs.proxy-tls.result }}",
              "shutdown":                "${{ needs.shutdown.result }}",
              "soak-resource":           "${{ needs.soak-resource.result }}",
              "validate-workflow":       "${{ needs.validate-workflow.result }}",
              "generate-evidence":       "${{ needs.generate-evidence.result }}",
          }

          errors = []
          summary_lines = ["## Qualification Results\n", "| Job | Result |", "|-----|--------|"]
          for job, result in sorted(required_jobs.items()):
              summary_lines.append(f"| {job} | {result} |")
              if result != "success":
                  errors.append(f"Required job '{job}' finished with result '{result}'")

          summary = "\n".join(summary_lines)
          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              with open(step_summary, "a") as f:
                  f.write(summary + "\n")

          gate_result = {
              "overall_pass": len(errors) == 0,
              "candidate_sha": "${{ needs.verify.outputs.sha }}",
              "jobs": required_jobs,
              "errors": errors,
              "dry_run": ${{ inputs.dry_run || false }},
          }
          with open("/tmp/job-result-gate.json", "w") as f:
              json.dump(gate_result, f, indent=2)

          if errors:
              for err in errors:
                  print(f"FAIL: {err}")
              raise SystemExit(1)

          print("All qualification gates passed.")
          PYEOF

      - name: Upload qualification summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-summary
          path: /tmp/job-result-gate.json
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────
  # 17. Generate status document from validated evidence
  # ──────────────────────────────────────────────────────────────────────
  status-generate:
    name: Generate status
    runs-on: ubuntu-latest
    if: ${{ always() && needs.qualification-gate.result == 'success' }}
    needs: [verify, qualification-gate, generate-evidence]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Download candidate bundle
        uses: actions/download-artifact@v4
        with:
          name: candidate-bundle
          path: candidate-bundle

      - name: Download evidence
        uses: actions/download-artifact@v4
        with:
          name: qualification-evidence
          path: evidence

      - name: Download qualification summary
        uses: actions/download-artifact@v4
        with:
          name: qualification-summary
          path: summary

      - name: Generate qualification summary from evidence
        run: |
          python scripts/generate_qualification_summary.py \
            --evidence evidence/compatibility-evidence.json \
            --artifact-manifest candidate-bundle/artifact-manifest.json \
            --candidate-identity candidate-bundle/candidate-identity.json \
            --bundle-index candidate-bundle/bundle-index.json \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --output /tmp/qualification-status.json

      - name: Upload qualification status
        uses: actions/upload-artifact@v4
        with:
          name: qualification-status
          path: /tmp/qualification-status.json
          retention-days: 30
