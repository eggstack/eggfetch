# TEMPORARY evidence workflow for M004 Tier 2 closure.
# Dispatch-only; deleted once evidence is collected. Not intended to merge.
# Mirrors .github/workflows/ci.yml (ubuntu-latest, pinned actions, Python 3.12)
# so the two blocked Tier 2 gates are evaluated at CI parity.
name: M004 Tier2 evidence (temporary)

on:
  push:
    branches:
      - feat/h3-caller-owned-datagram-routing

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  tier2-evidence:
    name: tier2-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Cache cargo registry and target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install pinned tooling and compatibility dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install -r scripts/ci-requirements.txt
          python -m pip install -r compat/httpx/0.28.1/requirements.txt
          python -m pip install -r compat/httpx2/2.12.0/requirements.txt

      - name: Build native module
        run: |
          source .venv/bin/activate
          maturin develop -m crates/eggfetch-python/Cargo.toml

      - name: Report interpreter baseline
        run: |
          source .venv/bin/activate
          python -c "import sys, ssl; print('python', sys.version.split()[0]); print('int.is_integer', (5).is_integer()); print('default_ca_count', len(ssl.create_default_context().get_ca_certs(binary_form=True)))"

      - name: Full pinned HTTPX compatibility suite
        run: |
          source .venv/bin/activate
          EGGFETCH_COMPAT_REQUIRED=1 python -m pytest \
            crates/eggfetch-python/tests/compat/ \
            -v --strict-markers

      - name: API manifest comparison (both facades)
        if: always()
        run: |
          source .venv/bin/activate
          tmp_dir="$(mktemp -d)"
          python scripts/generate_httpx_api_manifest.py --package eggfetch.compat.httpx --output "$tmp_dir/eggfetch-manifest.json"
          python scripts/compare_httpx_api_manifest.py \
            --reference compat/httpx/0.28.1/reference-api.json \
            --candidate "$tmp_dir/eggfetch-manifest.json" \
            --allowed compat/httpx/0.28.1/allowed-differences.toml
          python scripts/generate_httpx_api_manifest.py --package eggfetch.compat.httpx2 --output "$tmp_dir/eggfetch-httpx2-manifest.json"
          python scripts/compare_httpx_api_manifest.py \
            --reference compat/httpx2/2.12.0/reference-api.json \
            --candidate "$tmp_dir/eggfetch-httpx2-manifest.json" \
            --allowed compat/httpx2/2.12.0/allowed-differences.toml