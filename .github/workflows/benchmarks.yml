name: Benchmarks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      baseline:
        description: "Save results as baseline (for main branch)"
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Cache cargo registry and target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bench-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-bench-cargo-

      - name: Download baseline
        if: inputs.baseline != true
        uses: actions/download-artifact@v4
        with:
          name: benchmark-baselines
          path: target/criterion
        continue-on-error: true

      - name: Run microbenchmarks
        run: |
          if [ "${{ inputs.baseline }}" = "true" ]; then
            cargo bench -p eggfetch-bench --bench microbench -- --save-baseline main
          else
            cargo bench -p eggfetch-bench --bench microbench -- --baseline main 2>&1 | tee bench-results.txt || true
          fi

      - name: Run e2e benchmarks
        run: |
          if [ "${{ inputs.baseline }}" = "true" ]; then
            cargo bench -p eggfetch-bench --bench e2e -- --save-baseline main
          else
            cargo bench -p eggfetch-bench --bench e2e -- --baseline main 2>&1 | tee -a bench-results.txt || true
          fi

      - name: Run resource benchmarks
        run: |
          if [ "${{ inputs.baseline }}" = "true" ]; then
            cargo bench -p eggfetch-bench --bench resources -- --save-baseline main
          else
            cargo bench -p eggfetch-bench --bench resources -- --baseline main 2>&1 | tee -a bench-results.txt || true
          fi

      - name: Check for regressions
        if: inputs.baseline != true
        run: |
          if grep -q "Performance has regressed" bench-results.txt 2>/dev/null; then
            echo "::warning::Performance regressions detected. Review the benchmark results."
            # Extract regression details
            grep -A 5 "Performance has regressed" bench-results.txt || true
          fi

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            bench-results.txt
            target/criterion/**/new/
          retention-days: 30

      - name: Save baselines
        if: inputs.baseline == true || (github.ref == 'refs/heads/main' && github.event_name == 'push')
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-baselines
          path: target/criterion
          retention-days: 90
