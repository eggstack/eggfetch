name: Windows Qualification (manual M006C1 one-off)

# One-off M006C1 evidence surface — see
# plans/implementation/core-transport-policy/006c1-windows-qualification-and-downstream-closure.md
# §10. Manual dispatch ONLY; no push/PR triggers, so routine CI is unchanged
# (still the single ubuntu-latest job in ci.yml). Added with explicit
# maintainer approval against the M006 Windows regression history; remove this
# file when M006C1 closes (it must not become a permanent routine matrix).
# Complexity-budget note: second manual-dispatch workflow alongside pypi.yml,
# justified per docs/verification-policy.md by the concrete M006 regression
# history plus explicit approval.

on:
  workflow_dispatch: {}

concurrency:
  group: windows-qual-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  windows-matrix:
    name: windows-matrix
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Record environment (M006C1 section 5)
        shell: powershell
        run: |
          git rev-parse HEAD
          rustc --version
          cargo --version
          rustup show active-toolchain
          [System.Environment]::OSVersion.VersionString

      - name: Run M006 hermetic matrix (M006C1 section 5)
        shell: powershell
        run: cargo test -p eggfetch-core --all-features --test tls_response_completeness -- --test-threads=1 --nocapture
