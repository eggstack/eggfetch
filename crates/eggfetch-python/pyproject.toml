[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "eggfetch"
version = "0.4.0"
description = "Python bindings for eggfetch"
readme = "../../README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "eggfetch contributors"},
]
keywords = ["http", "client", "httpx", "async", "rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    # Free-threaded (PEP 703) support is qualified on CPython 3.14t and 3.15t:
    # multithreaded use is tested and the thread-safety constraints are
    # documented. The binding does not claim full thread safety — user
    # callbacks are not serialized.
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Rust",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/eggstack/eggfetch"
Repository = "https://github.com/eggstack/eggfetch"

[project.optional-dependencies]
test = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
]
httpx-transport = [
    "httpx>=0.28,<0.29",
]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "eggfetch._native"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
