[package]
name = "eggfetch-python"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Python bindings for eggfetch"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
eggfetch-core = { path = "../eggfetch-core", features = ["cookies", "multipart", "proxy", "compression-gzip", "compression-brotli", "compression-zstd", "compression-deflate", "http2"] }
pyo3 = { version = "0.23", features = ["extension-module"] }
pyo3-async-runtimes = { version = "0.23", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "fs"] }
bytes = "1"
encoding_rs = "0.8"
futures-util = "0.3"
http = "1"
url = "2"

[build-dependencies]
pyo3-build-config = "0.23"
