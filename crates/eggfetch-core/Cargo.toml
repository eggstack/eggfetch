[package]
name = "eggfetch-core"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Async-first Rust HTTP client engine (tokio + hyper) with connection pooling, phase-aware timeouts, TLS, proxies, and compression"
documentation = "https://docs.rs/eggfetch-core"
keywords = ["http", "https", "client", "async", "tls"]
categories = ["network-programming", "web-programming", "asynchronous"]

[lints]
workspace = true

[features]
default = ["http1", "tls-rustls", "tls-native-roots"]
http1 = ["hyper/http1", "hyper-util/http1", "hyper-rustls?/http1"]
http2 = ["dep:h2", "hyper/http2", "hyper-util/http2", "hyper-rustls?/http2"]
tls-rustls = [
    "dep:hyper-rustls",
    "dep:pem-rfc7468",
    "dep:rustls",
    "dep:tokio-rustls",
    "dep:webpki-roots",
    "hyper-rustls/ring",
    "hyper-rustls/logging",
    "hyper-rustls/tls12",
]
tls-native-roots = ["tls-rustls", "dep:rustls-native-certs"]
http3 = ["http1", "tls-rustls", "dep:quinn", "dep:h3", "dep:h3-quinn"]
json = []
compression-gzip = ["dep:async-compression", "async-compression/gzip", "dep:tokio-util", "tokio/io-util", "dep:flate2"]
compression-brotli = ["dep:async-compression", "async-compression/brotli", "dep:tokio-util", "tokio/io-util", "dep:brotli"]
compression-zstd = ["dep:async-compression", "async-compression/zstd", "dep:tokio-util", "tokio/io-util", "dep:zstd"]
compression-deflate = ["dep:async-compression", "async-compression/deflate", "dep:tokio-util", "tokio/io-util", "dep:flate2"]
cookies = ["dep:cookie"]
proxy = ["http1", "tls-rustls", "tokio/io-util"]
tracing = ["dep:tracing"]
multipart = []
test-util = ["tokio/test-util"]

[dependencies]
bytes = "1"
dashmap = "6"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client"] }
h2 = { version = "0.4", optional = true }
hyper-util = { version = "0.1", default-features = false, features = ["client", "client-legacy", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, optional = true }
pin-project-lite = "0.2"
percent-encoding = "2"
rustls = { version = "0.23", default-features = false, features = ["std"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync", "macros", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, optional = true }
url = "2"
thiserror = "2"

tower-service = "0.3"
base64 = "0.22"
cookie = { version = "0.18", default-features = false, features = ["percent-encode"], optional = true }
async-compression = { version = "0.4", default-features = false, features = ["tokio"], optional = true }
tokio-util = { version = "0.7", features = ["io"], optional = true }
flate2 = { version = "1", optional = true }
brotli = { version = "8", optional = true, default-features = false, features = ["std"] }
zstd = { version = "0.13", optional = true }
tracing = { version = "0.1", optional = true }
getrandom = "0.2"
httpdate = "1"
webpki-roots = { version = "0.26", optional = true }
pem-rfc7468 = { version = "0.1", features = ["alloc"], optional = true }
quinn = { version = "0.11", default-features = false, features = ["rustls", "ring", "runtime-tokio"], optional = true }
# Pinned h3 0.0.8: the `i-implement-...` feature only removes
# `#[non_exhaustive]` from error variants and exposes `ConnectionState`
# (`is_closing`) for GOAWAY/drain observation. No runtime behavior change;
# version-gated draining logic in `transport/http3.rs` depends on it and must
# be re-audited if the pinned h3 version changes.
h3 = { version = "0.0.8", optional = true, features = ["i-implement-a-third-party-backend-and-opt-into-breaking-changes"] }
h3-quinn = { version = "0.0.10", optional = true }

[dev-dependencies]
flate2 = "1"
proptest = "=1.5.0"
rcgen = "0.13"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "net", "macros", "sync", "time", "rt-multi-thread"] }
