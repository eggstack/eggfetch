[package]
name = "eggfetch-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Async-first HTTP client engine for eggfetch"

[lints]
workspace = true

[features]
default = ["http1", "tls-rustls"]
http1 = ["hyper/http1", "hyper-util/http1", "hyper-rustls/http1"]
http2 = ["hyper/http2", "hyper-util/http2", "hyper-rustls/http2"]
tls-rustls = []
http3 = ["dep:quinn", "dep:h3", "dep:h3-quinn"]
json = []
compression-gzip = ["dep:async-compression", "async-compression/gzip", "dep:tokio-util", "tokio/io-util", "dep:flate2"]
compression-brotli = ["dep:async-compression", "async-compression/brotli", "dep:tokio-util", "tokio/io-util"]
compression-zstd = ["dep:async-compression", "async-compression/zstd", "dep:tokio-util", "tokio/io-util"]
compression-deflate = ["dep:async-compression", "async-compression/deflate", "dep:tokio-util", "tokio/io-util", "dep:flate2"]
cookies = ["dep:cookie"]
proxy = ["tokio/io-util"]
tracing = []
multipart = []
test-util = ["tokio/test-util"]

[dependencies]
bytes = "1"
dashmap = "6"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "tokio", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "ring", "logging", "native-tokio", "webpki-tokio"] }
pin-project-lite = "0.2"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"] }
url = "2"
thiserror = "2"
base64 = "0.22"
cookie = { version = "0.18", default-features = false, features = ["percent-encode"], optional = true }
async-compression = { version = "0.4", default-features = false, features = ["tokio"], optional = true }
tokio-util = { version = "0.7", features = ["io"], optional = true }
flate2 = { version = "1", optional = true }
getrandom = "0.2"
httparse = "1"
httpdate = "1"
webpki-roots = "0.26"
pem-rfc7468 = { version = "0.1", features = ["alloc"] }
quinn = { version = "0.11", default-features = false, features = ["rustls", "ring"], optional = true }
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }

[dev-dependencies]
flate2 = "1"
rcgen = "0.13"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "net", "macros", "sync", "time"] }
