[package]
name = "eggfetch-core"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Async-first Rust HTTP client engine (tokio + hyper) with connection pooling, phase-aware timeouts, TLS, proxies, and compression"
documentation = "https://docs.rs/eggfetch-core"
keywords = ["http", "https", "client", "async", "tls"]
categories = ["network-programming", "web-programming", "asynchronous"]

[lints]
workspace = true

[features]
default = ["http1", "tls-rustls", "tls-native-roots"]
# Primitive Hyper protocol slices. Every H1/H2 route (standard and advanced)
# builds on these; they own only the `hyper`/`hyper-util`/`hyper-rustls`
# protocol flags.
transport-http1 = ["hyper/http1", "hyper-util/http1", "hyper-rustls?/http1"]
transport-http2 = ["dep:h2", "hyper/http2", "hyper-util/http2", "hyper-rustls?/http2"]
# Routing capability markers. `standard-route` is the ordinary DNS -> TCP/TLS
# Hyper path. `advanced-routing` owns custom Dialer, DirectConnector /
# local-address / socket options, resolved-target/pinned-address cache,
# SNI-override cache, and UDS.
standard-route = []
advanced-routing = []
# Compatibility/low-level slices preserve their historical behavior
# (transport + both route capabilities).
native-http1 = ["transport-http1", "standard-route", "advanced-routing"]
native-http2 = ["transport-http2", "standard-route", "advanced-routing"]
# Lean high-level recipes: standard route + URL API without advanced routing
# and without the `logical-retry`/`redirects`/`basic-auth` policy bundle.
# Select with `tls-rustls` for HTTPS; each request dispatches once and 3xx
# returns without a second hop.
standard-http1 = ["transport-http1", "standard-route", "high-level-url"]
standard-http2 = ["transport-http2", "standard-route", "high-level-url"]
# Compatibility/high-level aliases: existing `http1`/`http2` names retain
# their current user-visible behavior (transport + standard + advanced
# routing + high-level URL API + logical retry + redirect following +
# Basic auth).
http1 = ["native-http1", "high-level-url", "logical-retry", "redirects", "basic-auth"]
http2 = ["native-http2", "high-level-url", "logical-retry", "redirects", "basic-auth"]
# High-level string/URL request semantics (backed by `url`; native callers
# own any IDNA/punycode conversion before constructing `http::Uri`).
high-level-url = ["dep:url", "dep:percent-encoding"]
# Logical retry orchestration (policy types, backoff/jitter, `Retry-After`
# HTTP-date parsing). Omitted by the lean high-level profile, which
# dispatches once under the outer total deadline.
logical-retry = ["dep:getrandom", "dep:httpdate"]
# Redirect-following loop, hop reconstruction, and history. Omitted by the
# lean profile, which returns 3xx responses without following.
redirects = []
# Basic auth owns the core `base64` dependency; Bearer auth needs no Base64
# and remains available without this feature.
basic-auth = ["dep:base64"]
tls-rustls = [
    "dep:hyper-rustls",
    "dep:pem-rfc7468",
    "dep:rustls",
    "dep:tokio-rustls",
    "dep:webpki-roots",
    "hyper-rustls/ring",
    "hyper-rustls/logging",
    "hyper-rustls/tls12",
]
tls-native-roots = ["tls-rustls", "dep:rustls-native-certs"]
http3 = ["http1", "tls-rustls", "dep:quinn", "dep:h3", "dep:h3-quinn", "high-level-url"]
json = ["dep:serde", "dep:serde_json"]
compression-gzip = ["dep:async-compression", "async-compression/gzip", "dep:tokio-util", "tokio/io-util", "dep:flate2"]
compression-brotli = ["dep:async-compression", "async-compression/brotli", "dep:tokio-util", "tokio/io-util", "dep:brotli"]
compression-zstd = ["dep:async-compression", "async-compression/zstd", "dep:tokio-util", "tokio/io-util", "dep:zstd"]
compression-deflate = ["dep:async-compression", "async-compression/deflate", "async-compression/zlib", "dep:tokio-util", "tokio/io-util", "dep:flate2"]
cookies = ["dep:cookie", "high-level-url"]
proxy = ["http1", "tls-rustls", "tokio/io-util", "high-level-url", "dep:eggfetch-http-connect", "dep:base64"]
tracing = ["dep:tracing"]
multipart = ["dep:getrandom"]
test-util = ["tokio/test-util"]

[dependencies]
bytes = "1"
eggfetch-http-connect = { version = "0.2.1", path = "../eggfetch-http-connect", optional = true }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client"] }
h2 = { version = "0.4", optional = true }
hyper-util = { version = "0.1", default-features = false, features = ["client", "client-legacy", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, optional = true }
pin-project-lite = "0.2"
percent-encoding = { version = "2", optional = true }
rustls = { version = "0.23", default-features = false, features = ["std"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync", "macros", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, optional = true }
url = { version = "2", optional = true }
thiserror = "2"
serde = { version = "1", optional = true }
serde_json = { version = "1", optional = true }

tower-service = "0.3"
base64 = { version = "0.23", optional = true }
cookie = { version = "0.18", default-features = false, features = ["percent-encode"], optional = true }
async-compression = { version = "0.4", default-features = false, features = ["tokio"], optional = true }
tokio-util = { version = "0.7", features = ["io"], optional = true }
flate2 = { version = "1", optional = true }
brotli = { version = "8", optional = true, default-features = false, features = ["std"] }
zstd = { version = "0.13", optional = true }
tracing = { version = "0.1", optional = true }
getrandom = { version = "0.2", optional = true }
httpdate = { version = "1", optional = true }
webpki-roots = { version = "0.26", optional = true }
pem-rfc7468 = { version = "0.1", features = ["alloc"], optional = true }
quinn = { version = "0.11", default-features = false, features = ["rustls", "ring", "runtime-tokio"], optional = true }
# Pinned h3 0.0.8: the `i-implement-...` feature only removes
# `#[non_exhaustive]` from error variants and exposes `ConnectionState`
# (`is_closing`) for GOAWAY/drain observation. No runtime behavior change;
# version-gated draining logic in `transport/http3.rs` depends on it and must
# be re-audited if the pinned h3 version changes.
h3 = { version = "0.0.8", optional = true, features = ["i-implement-a-third-party-backend-and-opt-into-breaking-changes"] }
h3-quinn = { version = "0.0.10", optional = true }

[dev-dependencies]
flate2 = "1"
proptest = "=1.5.0"
rcgen = "0.13"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "net", "macros", "sync", "time", "rt-multi-thread"] }
