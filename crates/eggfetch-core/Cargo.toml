[package]
name = "eggfetch-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Async-first HTTP client engine for eggfetch"

[lints]
workspace = true

[features]
default = ["http1", "tls-rustls"]
http1 = ["hyper/http1", "hyper-util/http1", "hyper-rustls/http1"]
http2 = ["hyper/http2", "hyper-util/http2"]
tls-rustls = []
json = []
compression-gzip = []
compression-brotli = []
compression-zstd = []
cookies = []
proxy = []
tracing = []

[dependencies]
bytes = "1"
dashmap = "6"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "tokio", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "ring", "logging", "native-tokio"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"] }
url = "2"
thiserror = "2"
