[package]
name = "eggfetch-ffi"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Stable C ABI bindings for the eggfetch-core HTTP engine"
documentation = "https://docs.rs/eggfetch-ffi"
keywords = ["ffi", "c-abi", "http", "bindings", "client"]
categories = ["api-bindings", "network-programming"]

[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["http1", "tls-rustls", "tls-native-roots", "cookies", "proxy", "compression-gzip"]
http1 = ["eggfetch-core/http1"]
http2 = ["eggfetch-core/http2"]
tls-rustls = ["eggfetch-core/tls-rustls"]
tls-native-roots = ["tls-rustls", "eggfetch-core/tls-native-roots"]
http3 = ["eggfetch-core/http3"]
cookies = ["eggfetch-core/cookies"]
proxy = ["eggfetch-core/proxy"]
compression-gzip = ["eggfetch-core/compression-gzip"]
compression-brotli = ["eggfetch-core/compression-brotli"]
compression-zstd = ["eggfetch-core/compression-zstd"]
compression-deflate = ["eggfetch-core/compression-deflate"]
multipart = ["eggfetch-core/multipart"]

[dependencies]
# The C ABI below is unconditional: `eggfetch_client_builder_follow_redirects`,
# `eggfetch_client_builder_max_redirects` and `eggfetch_client_builder_basic_auth`
# are always exported, so core must always provide the capabilities they drive.
# These two edges were previously satisfied by accident, through the old
# `proxy = ["http1", ...]` implication; core's `proxy` no longer selects the
# `http1` alias, so the requirement is declared here explicitly instead of
# leaving the FFI dependent on another feature's transitive closure.
eggfetch-core = { version = "0.4.0", path = "../eggfetch-core", default-features = false, features = ["redirects", "basic-auth"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
bytes = "1"
http = "1"
url = "2"
futures-util = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
