[package]
name = "eggfetch-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Command-line interface for eggfetch"

[lints]
workspace = true

[[bin]]
name = "eggfetch"
path = "src/main.rs"

[dependencies]
eggfetch-core = { path = "../eggfetch-core", features = ["cookies", "multipart", "proxy"] }
clap = { version = "4", features = ["derive", "wrap_help", "env"] }
clap_complete = "4"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "fs", "signal", "io-std"] }
anyhow = "1"
bytes = "1"
futures-util = "0.3"
http = "1"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
flate2 = "1"