[package]
name = "eggfetch-cli"
version = "0.2.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Command-line HTTP client powered by the eggfetch-core engine"
documentation = "https://docs.rs/eggfetch-cli"
keywords = ["http", "https", "cli", "client", "terminal"]
categories = ["command-line-utilities", "network-programming", "web-programming"]

[lints]
workspace = true

[features]
default = []
http2 = ["eggfetch-core/http2"]
http3 = ["eggfetch-core/http3"]
# Opt-in diagnostics: forwards the engine's `tracing` events and installs a
# stderr subscriber so they reach the operator. Off by default, so the
# published binary keeps its current behaviour and dependency set.
tracing = ["eggfetch-core/tracing", "dep:tracing"]

[[bin]]
name = "eggfetch"
path = "src/main.rs"

[dependencies]
eggfetch-core = { version = "0.2.2", path = "../eggfetch-core", features = ["cookies", "multipart", "proxy"] }
clap = { version = "4", features = ["derive", "wrap_help", "env"] }
clap_complete = "4"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "fs", "signal", "io-std"] }
anyhow = "1"
bytes = "1"
futures-util = "0.3"
http = "1"
tracing = { version = "0.1", optional = true }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
flate2 = "1"
# The `--http2` negotiation fixture needs a TLS server that speaks HTTP/2
# over ALPN. Every crate below is already in the workspace lockfile through
# `eggfetch-core`, so the fixture adds a dev-dependency edge but no new
# package to the dependency graph. `resolver = "3"` keeps these features out
# of the published binary.
h2 = "0.4"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "time", "sync"] }
