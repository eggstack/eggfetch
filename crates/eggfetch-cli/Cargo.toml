[package]
name = "eggfetch-cli"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Command-line HTTP client powered by the eggfetch-core engine"
documentation = "https://docs.rs/eggfetch-cli"
keywords = ["http", "https", "cli", "client", "terminal"]
categories = ["command-line-utilities", "network-programming", "web-programming"]

[lints]
workspace = true

[[bin]]
name = "eggfetch"
path = "src/main.rs"

[dependencies]
eggfetch-core = { version = "0.1.2", path = "../eggfetch-core", features = ["cookies", "multipart", "proxy"] }
clap = { version = "4", features = ["derive", "wrap_help", "env"] }
clap_complete = "4"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "fs", "signal", "io-std"] }
anyhow = "1"
bytes = "1"
futures-util = "0.3"
http = "1"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
flate2 = "1"