[package]
name = "reqwest-json"
version = "0.1.0"
edition = "2021"
publish = false
description = "Embedded HTTPS + JSON + streaming consumer for reqwest footprint comparison (Profile B, WebPKI primary)"
license = "MIT"

[workspace]

[features]
default = []
native = ["reqwest/rustls-tls-native-roots"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = false
debug = false
panic = "unwind"
