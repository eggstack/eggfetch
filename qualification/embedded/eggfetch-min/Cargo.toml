[package]
name = "eggfetch-min"
version = "0.1.0"
edition = "2021"
publish = false
description = "Minimal embedded HTTPS streaming consumer for eggfetch footprint qualification (Profile A, WebPKI primary)"
license = "MIT"

[workspace]

[features]
default = []
native = ["eggfetch-core/tls-native-roots"]

[dependencies]
eggfetch-core = { path = "../../../crates/eggfetch-core", default-features = false, features = ["http1", "tls-rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = false
debug = false
panic = "unwind"
