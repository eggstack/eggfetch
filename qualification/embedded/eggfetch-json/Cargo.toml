[package]
name = "eggfetch-json"
version = "0.1.0"
edition = "2021"
publish = false
description = "Embedded HTTPS + JSON + streaming consumer for eggfetch footprint qualification (Profile B, WebPKI primary)"
license = "MIT"

[workspace]

[features]
default = []
native = ["eggfetch-core/tls-native-roots"]

[dependencies]
eggfetch-core = { path = "../../../crates/eggfetch-core", default-features = false, features = ["http1", "tls-rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = false
debug = false
panic = "unwind"
