[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "httpx"
version = "0.28.1"
description = "Controlled replacement artifact providing 'import httpx' backed by eggfetch. NEVER publish to public PyPI."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
authors = [{ name = "eggfetch team" }]
dependencies = ["eggfetch>=0.1.0"]

[project.urls]
Homepage = "https://github.com/eggstack/eggfetch"

[tool.setuptools]
# The runtime code lives once, in the shared replacement source. This package
# maps its `httpx` package at it instead of keeping a second copy.
packages = ["httpx"]
package-dir = {httpx = "../httpx-replacement-source/httpx"}

[tool.setuptools.package-data]
httpx = ["py.typed"]
