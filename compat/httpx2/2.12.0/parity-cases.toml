# Parity case registry — HTTPX2 2.12.0 baseline
# Each case has a stable ID, description, sync/async applicability,
# test references, and required result (parity or intentional-difference).
# Baseline cases intentionally fail/xfail until core/SSE/WS plans close;
# this inventory is engineering tracking, not qualification evidence.

# ── API objects/signatures ──────────────────────────────────────────

[[case]]
id = "H2X-API-001"
description = "FunctionAuth public export, construction, sync/async integration"
sync = true
async = true
tests = ["test_httpx2_api_parity.py"]
result = "parity"
phase = "core"

