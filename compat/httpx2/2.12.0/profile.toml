[compatibility-profile]
schema-version = "1"
generator = "eggfetch-compat-profile"
version = "1"
created = "2026-09-10"
# The live Stage C binding for this profile, and the full history of every
# prior binding, renewal, and supersession, are recorded in the canonical
# qualification ledger: plans/httpx-parity-correction-status.md
# This file carries machine-readable binding fields only; the historical SHA
# log is not duplicated here.
stage = "stage-c-qualified"
status = "qualified"
qualification-sha = "26fa619299fb8d447f25cbcb5eb713a1f537a30c"
qualification-date = "2026-10-22"
previous-qualification-sha = "42a9c96db5b25354843bd83bd458c71757e95651"
historical-current-qualification-sha = "312cd4402ea2b4b27bf54cf7dc36924a1d449adc"
historical-qualification-sha = "015a56d7ec3edf186eec8ebccff01cbf5584274e"
reference = "httpx2==2.12.0"

[reference]
distribution = "httpx2"
version = "2.12.0"
python-versions = ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
sync-backend = "httpcore2"
async-backend = "httpcore2"
httpcore-version = "2.12.0"

[eggfetch]
distribution = "eggfetch"
# API compatibility is separate from distribution support: eggfetch wheels
# cover Python 3.10–3.15 (see docs/releases/process.md). Facade Stage C
# qualification remains bound to 3.10–3.14 until renewed on a 3.15-tested
# executable SHA; HTTPX2 3.15-only syntax is not advertised as supported.
python-versions = ["3.10", "3.11", "3.12", "3.13", "3.14"]
sync-backend = "rust-tokio"
async-backend = "rust-tokio"

[modules]
# Public modules included in the compatibility contract
public = ["httpx2"]
# Private modules excluded (prefixed with _)
private-excluded = ["_transports", "_content", "_models", "_decoders", "_exceptions", "_multipart", "_urlparse", "_config"]

[feature-extras]
# HTTPX2 optional extras and their eggfetch equivalents (Stage C target)
http2 = { httpx2 = "httpx2[http2]", eggfetch = "http2=True" }
brotli = { httpx2 = "httpx2[brotli]", eggfetch = "compression-brotli feature" }
zstd = { httpx2 = "httpx2[zstd]", eggfetch = "compression-zstd feature" }
socks = { httpx2 = "httpx2[socks]", eggfetch = "native Rust SOCKS5 (socks5/socks5h)" }
ws = { httpx2 = "httpx2[ws]", eggfetch = "optional WebSocket over 101 network_stream (wsproto framing)" }
cli = { httpx2 = "httpx2[cli]", eggfetch = "not-applicable (CLI cosmetic/dependency extra)" }

[compatibility-categories]
required-now = "Must match for current stage"
required-later = "Accepted gap assigned to later roadmap phase"
intentional-difference = "Reviewed and explicitly allowed"
not-public = "Excluded from contract"
not-applicable = "Reference feature cannot apply to current product stage"
resolved = "Previously required gap, now implemented and verified"
