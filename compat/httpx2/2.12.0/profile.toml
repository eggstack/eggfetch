[compatibility-profile]
schema-version = "1"
generator = "eggfetch-compat-profile"
version = "1"
created = "2026-09-10"
# The prior Post-next-scope Stage C claim at `65beb675a5380d3ff4291da6833b91ebf12c769a`
# is historical only. The active H3 program changed executable test behavior;
# this profile was renewed on the clean frozen executable tree below. The
# immediately preceding `639bf186...` binding is historical only because the
# post-freeze HTTP/3 diagnostics audit corrected a native counter's semantics.
# H3's
# separate graduation status remains experimental and is not part of this
# HTTPX2 API-parity claim.
# The prior `cc90f5e...` (2026-09-10) evidence is historical only: H3 interop
# corpus expansion, fuzz_alt_svc suppressor coverage, and parity truth passes
# invalidated it per the exact-SHA rule. Independent
# of the HTTPX 0.28.1 Stage C claim on the same SHA; neither profile
# mutates the other.
# The native body/TLS extensibility and first-poll timeout correction
# invalidated the previous binding; this profile was renewed after the
# corrected final freeze below. A later qualification-only TLS provider/mTLS
# fixture hardening pass invalidated that binding and was requalified below.
# Native request-failure introspection then changed core request/error plumbing;
# this profile was renewed after three consecutive full compatibility passes on
# the final executable tree below.
# Proxy route-pinning qualification then changed executable behavior and proxy
# candidate-fallback coverage; this profile was renewed on the final clean
# executable freeze below.
# The native Tower service adapter then changed executable source/test inputs;
# this profile was renewed on the final clean executable freeze below.
# The standard-route DNS provenance correction then changed core connector
# plumbing; this profile was renewed on the final clean executable freeze
# below.
stage = "stage-c-qualified"
status = "qualified"
qualification-sha = "312cd4402ea2b4b27bf54cf7dc36924a1d449adc"
qualification-date = "2026-09-15"
historical-current-qualification-sha = "490320f6e99fbb7916280d6bcdd21660bd74f858"
reference = "httpx2==2.12.0"

[reference]
distribution = "httpx2"
version = "2.12.0"
python-versions = ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
sync-backend = "httpcore2"
async-backend = "httpcore2"
httpcore-version = "2.12.0"

[eggfetch]
distribution = "eggfetch"
# API compatibility is separate from distribution support: eggfetch wheels
# cover Python 3.10–3.13 (see AGENTS.md Release). HTTPX2 3.14/3.15-only
# syntax is not advertised as supported until packaging expands.
python-versions = ["3.10", "3.11", "3.12", "3.13"]
sync-backend = "rust-tokio"
async-backend = "rust-tokio"

[modules]
# Public modules included in the compatibility contract
public = ["httpx2"]
# Private modules excluded (prefixed with _)
private-excluded = ["_transports", "_content", "_models", "_decoders", "_exceptions", "_multipart", "_urlparse", "_config"]

[feature-extras]
# HTTPX2 optional extras and their eggfetch equivalents (Stage C target)
http2 = { httpx2 = "httpx2[http2]", eggfetch = "http2=True" }
brotli = { httpx2 = "httpx2[brotli]", eggfetch = "compression-brotli feature" }
zstd = { httpx2 = "httpx2[zstd]", eggfetch = "compression-zstd feature" }
socks = { httpx2 = "httpx2[socks]", eggfetch = "native Rust SOCKS5 (socks5/socks5h)" }
ws = { httpx2 = "httpx2[ws]", eggfetch = "optional WebSocket over 101 network_stream (wsproto framing)" }
cli = { httpx2 = "httpx2[cli]", eggfetch = "not-applicable (CLI cosmetic/dependency extra)" }

[compatibility-categories]
required-now = "Must match for current stage"
required-later = "Accepted gap assigned to later roadmap phase"
intentional-difference = "Reviewed and explicitly allowed"
not-public = "Excluded from contract"
not-applicable = "Reference feature cannot apply to current product stage"
resolved = "Previously required gap, now implemented and verified"
