[portfolio]
schema-version = "2"
status = "phase-6"
created = "2026-07-24"
reference-profile = "../httpx/0.28.1/profile.toml"
description = "Downstream consumer packages that exercise distinct httpx compatibility surfaces"
stage-c-categories = [
  "sync-sdk-client",
  "asyncio-sdk-client",
  "asgi-test-client",
  "mock-transport-request-matching",
  "streaming-sse-consumption",
  "custom-auth-flow",
  "event-hooks-instrumentation",
  "custom-mounted-transport",
]

[[package]]
name = "httpx"
version = "0.28.1"
license = "BSD-3-Clause"
category = "contract-tests"
rationale = "Reference implementation of the httpx API surface. Used for contract tests and API manifest comparison."
usage = "informational"
test-subset = "spec"
expected-network-isolation = true
optional-dependencies = []
known-incompatibilities = []
test-command = "python -c 'import httpx; assert getattr(httpx, \"__eggfetch_shim__\", False); print(f\"httpx shim OK: {httpx.__file__}\")'"
min-tests = 0
source-type = "pypi"
source-locator = "httpx==0.28.1"
source-hash = ""
python-versions = ">=3.8"
public-httpx-api = ["Client", "AsyncClient", "Request", "Response", "URL", "Headers", "Cookies", "Auth"]
install-command = "pip install httpx==0.28.1"
test-working-dir = "."
test-result-format = "exit-code"
min-collected = 0
max-skipped = -1
max-xfailed = -1
timeout = 60
network-policy = "isolated"
category-ids = ["contract-tests"]
release-blocking = false
update-owner = "eggfetch-team"
review-cadence = "every-phase"

[[package]]
name = "respx"
version = "0.21.1"
license = "BSD-3-Clause"
category = "mock-transport-user"
rationale = "Widely-used mock transport library that patches httpx transports. Exercises MockTransport and Router APIs."
usage = "required"
test-subset = "unit"
expected-network-isolation = true
optional-dependencies = ["httpx"]
known-incompatibilities = [
  "respx patches httpx._transports.default which is private API"
]
test-command = "python -c \"from httpx import Client, MockTransport, Response; t = MockTransport(lambda r: Response(200, json={'mocked': True})); c = Client(transport=t); resp = c.get('http://test/mock'); assert resp.status_code == 200; assert resp.json()['mocked'] is True; print('respx behavioral OK')\""
min-tests = 1
source-type = "pypi"
source-locator = "respx==0.21.1"
source-hash = ""
python-versions = ">=3.8"
public-httpx-api = ["MockTransport", "Router"]
install-command = "pip install respx==0.21.1"
test-working-dir = "."
test-result-format = "exit-code"
min-collected = 1
max-skipped = -1
max-xfailed = -1
timeout = 60
network-policy = "isolated"
category-ids = ["mock-transport-request-matching"]
release-blocking = true
update-owner = "eggfetch-team"
review-cadence = "every-phase"

