# Allowed differences between HTTPX 0.28.1 and eggfetch
# Each entry must have a stable ID, category, and linked tests.

[[difference]]
id = "REDIRECT-DEFAULT-001"
category = "intentional-difference"
symbol = "httpx.Client(follow_redirects=...)"
behavior-case = "redirect-default"
reference-behavior = "HTTPX follows redirects by default (follow_redirects=True)"
eggfetch-behavior = "eggfetch does NOT follow redirects by default (follow_redirects=True required)"
rationale = "Security-first default; prevents accidental redirects to unexpected hosts"
compatibility-stage-impact = "phase-0"
security-improvement = true
migration-impact = "Users must add follow_redirects=True explicitly"
owner = "eggfetch-team"
review-milestone = "phase-0"
tests = ["test_differential.py::TestRedirectDefault", "test_differential.py::TestKnownDifferences::test_redirect_default_differs"]

[[difference]]
id = "PROXY-ENV-001"
category = "required-now"
symbol = "httpx.Client(proxy=...)"
behavior-case = "proxy-env-vars"
reference-behavior = "HTTPX reads HTTP_PROXY/HTTPS_PROXY/NO_PROXY env vars"
eggfetch-behavior = "eggfetch reads proxy env vars when trust_env=True (Phase 1)"
rationale = "Implemented in Phase 1; trust_env=True reads env vars by default"
compatibility-stage-impact = "phase-1"
security-improvement = false
migration-impact = "None; behavior now matches HTTPX"
owner = "eggfetch-team"
review-milestone = "phase-1"
tests = ["test_differential.py::TestKnownDifferences::test_proxy_config_differs"]

[[difference]]
id = "TIMEOUT-TUPLE-001"
category = "intentional-difference"
symbol = "httpx.Timeout(...)"
behavior-case = "timeout-api"
reference-behavior = "HTTPX accepts Timeout() with named phase parameters"
eggfetch-behavior = "eggfetch accepts Timeout() with named phase parameters (compatible)"
rationale = "API shape is compatible; requests tuple syntax is different"
compatibility-stage-impact = "phase-0"
security-improvement = false
migration-impact = "Minimal; Timeout() API is compatible"
owner = "eggfetch-team"
review-milestone = "phase-0"
tests = ["test_differential.py::TestTimeout"]

[[difference]]
id = "EVENT-HOOKS-001"
category = "resolved"
symbol = "httpx.EventHooks / httpx.Client(event_hooks=...)"
behavior-case = "event-hooks"
reference-behavior = "HTTPX supports event_hooks={'request': [...], 'response': [...]}"
eggfetch-behavior = "eggfetch supports event hooks via Client(event_hooks=...)"
rationale = "Implemented in Phase 4; event hooks now supported"
compatibility-stage-impact = "phase-0"
security-improvement = false
migration-impact = "Users needing event hooks must use other mechanisms"
owner = "eggfetch-team"
review-milestone = "phase-4"
tests = ["test_hooks.py"]

[[difference]]
id = "TRANSPORTS-001"
category = "resolved"
symbol = "httpx.ASGITransport / httpx.WSGITransport"
behavior-case = "in-process-transports"
reference-behavior = "HTTPX supports WSGI/ASGI in-process transports"
eggfetch-behavior = "eggfetch supports ASGITransport and WSGITransport"
rationale = "ASGITransport and WSGITransport were implemented in Phase 4"
compatibility-stage-impact = "phase-0"
security-improvement = false
migration-impact = "Use a real test server instead"
owner = "eggfetch-team"
review-milestone = "phase-4"
tests = ["test_asgi.py", "test_wsgi.py"]

[[difference]]
id = "MOUNTS-001"
category = "resolved"
symbol = "httpx.Client(mounts=...)"
behavior-case = "per-host-transports"
reference-behavior = "HTTPX supports per-host transport mounts"
eggfetch-behavior = "eggfetch supports per-host transport mounts via Client(mounts=...)"
rationale = "Mounts were implemented in Phase 4"
compatibility-stage-impact = "phase-0"
security-improvement = false
migration-impact = "Users needing per-host routing must handle externally"
owner = "eggfetch-team"
review-milestone = "phase-4"
tests = ["test_mounts.py"]

[[difference]]
id = "TRIO-ANYIO-001"
category = "not-applicable"
symbol = "httpx.AsyncClient(transport=...)"
behavior-case = "trio-anyio"
reference-behavior = "HTTPX supports Trio and AnyIO backends"
eggfetch-behavior = "eggfetch uses asyncio only"
rationale = "eggfetch is built on tokio (Rust); asyncio integration is the Python path"
