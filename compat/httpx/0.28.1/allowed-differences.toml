[[difference]]
id = "EXCEPTION-OPTIONAL-MSG-001"
category = "stage-bounded"
symbol = "InvalidURL"
difference-type = "parameter-name"
member = "InvalidURL"
reference = "['self', 'message']"
candidate = "['self', 'message', 'kwargs']"
behavior-case = "exception-optional-message"
reference-behavior = "HTTPX InvalidURL requires message as a mandatory parameter"
eggfetch-behavior = "eggfetch InvalidURL accepts message with a default of empty string"
rationale = "eggfetch makes the message parameter optional for convenience. The behavior is identical when a message is provided."
compatibility-stage-impact = "stage-c"
security-improvement = "false"
migration-impact = "Minimal; message can still be provided"
owner = "eggfetch-team"
review-milestone = "stage-d"
tests = ["test_exceptions.py"]
