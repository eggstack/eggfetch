security-improvement = false
migration-impact = "None for asyncio users"
owner = "eggfetch-team"
review-milestone = "phase-0"
tests = []

[[difference]]
id = "EXCEPTION-NAMES-001"
category = "intentional-difference"
symbol = "httpx.HTTPError / eggfetch.EggfetchError"
behavior-case = "exception-hierarchy"
reference-behavior = "HTTPX uses httpx.HTTPError as base exception"
eggfetch-behavior = "eggfetch uses EggfetchError as base exception"
rationale = "Different base exception name; subclass structure is compatible"
compatibility-stage-impact = "phase-0"
security-improvement = false
migration-impact = "Catch EggfetchError instead of HTTPError"
owner = "eggfetch-team"
review-milestone = "phase-0"
tests = ["test_response_compat.py"]

[[difference]]
id = "RAISE-FOR-STATUS-001"
category = "intentional-difference"
symbol = "httpx.Response.raise_for_status()"
behavior-case = "raise-for-status-return"
reference-behavior = "HTTPX Response.raise_for_status() returns the response"
eggfetch-behavior = "eggfetch Response.raise_for_status() returns the response"
rationale = "API is compatible; both return the response object"
compatibility-stage-impact = "phase-0"
security-improvement = false
migration-impact = "None"
owner = "eggfetch-team"
review-milestone = "phase-0"
tests = ["test_response_compat.py"]
