# Allowed differences between HTTPX 0.28.1 and eggfetch
# Each entry must have a stable ID, category, and linked tests.

[[difference]]
id = "REDIRECT-DEFAULT-001"
category = "resolved"
symbol = "httpx.Client(follow_redirects=...)"
behavior-case = "redirect-default"
reference-behavior = "HTTPX 0.28.1 does NOT follow redirects by default (follow_redirects=False)"
eggfetch-behavior = "eggfetch does NOT follow redirects by default (follow_redirects=False)"
rationale = "Both HTTPX 0.28.1 and eggfetch default to follow_redirects=False. No difference."
compatibility-stage-impact = "resolved"
security-improvement = false
migration-impact = "None; defaults match"
owner = "eggfetch-team"
review-milestone = "corrective-closure"
tests = []

