[[difference]]
id = "TRANSPORT-SOCKET-OPTIONS-004"
category = "stage-bounded"
classification = "intentional"
symbol = "HTTPTransport.socket_options"
member = "socket_options"
reference = "four-element tuples accepted by HTTPX 0.28.1 constructor"
candidate = "four-element tuples rejected by compatibility-boundary validation"
behavior-case = "socket-options-four-tuple"
reference-behavior = "HTTPX accepts (level, option, None, optlen) and forwards it to the platform socket API; the observed use-time result is option/platform dependent"
eggfetch-behavior = "eggfetch accepts safe three-element options and rejects four-element options before native dispatch"
rationale = "The valid HTTPX four-element form represents an arbitrary null-pointer setsockopt operation. EggFetch intentionally supports bounded safe three-element operations and rejects arbitrary pointer semantics at the compatibility boundary; this is a narrow safe-Rust Stage C limitation, not a claim that HTTPX rejects the valid form."
compatibility-stage-impact = "stage-c"
security-improvement = "true"
migration-impact = "Callers must use the supported three-element (level, option, value) form."
owner = "eggfetch-team"
review-milestone = "corrective-closure"
tests = ["test_httpx_reference_pinning.py", "test_protocol_and_unsupported_options.py"]
non_expiring = true
