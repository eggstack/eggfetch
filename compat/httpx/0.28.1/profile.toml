# corpus expansion (13 to 20 tests), fuzz_alt_svc suppressor coverage, and
# httpx2 parity truth passes changed test/validation behavior, invalidating the prior binding per the
# exact-SHA rule. The post-maturation
# `d034a10...` evidence is retained as historical only; the H3
# Alt-Svc/discovery/fallback/draining work, H3 interop evidence (experimental
# retained), HTTPX2 sibling facade (independent profile, no 0.28.1 leakage),
# 1.0-preview tracking, oracle generalization (httpx2 sentinel), and
# extended-tier dual-profile gates changed executable/test/validation
# behavior, invalidating the prior binding per the exact-SHA rule.
stage = "stage-c-qualified"
status = "qualified"
qualification-sha = "78a77ea153aae239ce7b722aeb9909a87df3bbb5"
qualification-date = "2026-09-11"
historical-current-qualification-sha = "639bf186a71c054e11278d1b160ffe7a6f172c02"
historical-qualification-sha = "cc90f5ed561bbe10d4c26accc54ed3b916518f98, d034a1005857a7f403222dda4bda5f2f204a44fe, d24101be6ed7be64463813750da5b4043d9905ec, 5c7899fefb6df087dfa1b3578fbef9ba64f87742, 9ffa6cd85848fd16a424b65f73254351911777c4, c44d4f25ffebc1a792335163ae4bc106076b3963"
reference = "httpx==0.28.1"

[reference]
distribution = "httpx"
version = "0.28.1"
python-versions = ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
sync-backend = "httpcore"
async-backend = "httpcore"

[eggfetch]
distribution = "eggfetch"
python-versions = ["3.10", "3.11", "3.12", "3.13"]
sync-backend = "rust-tokio"
async-backend = "rust-tokio"

[modules]
# Public modules included in the compatibility contract
public = ["httpx"]
# Private modules excluded (prefixed with _)
private-excluded = ["_transports", "_content", "_models", "_decoders", "_exceptions", "_multipart", "_urlparse", "_config"]

[feature-extras]
# HTTPX optional extras and their eggfetch equivalents
http2 = { httpx = "httpx[http2]", eggfetch = "http2=True" }
brotli = { httpx = "httpx[brotli]", eggfetch = "compression-brotli feature" }
zstd = { httpx = "httpx[zstd]", eggfetch = "compression-zstd feature" }
socks = { httpx = "httpx[socks]", eggfetch = "native Rust SOCKS5 (socks5/socks5h)" }

[compatibility-categories]
required-now = "Must match for current stage"
required-later = "Accepted gap assigned to later roadmap phase"
intentional-difference = "Reviewed and explicitly allowed"
not-public = "Excluded from contract"
not-applicable = "Reference feature cannot apply to current product stage"
resolved = "Previously required gap, now implemented and verified"
