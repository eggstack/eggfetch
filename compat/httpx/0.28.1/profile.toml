[compatibility-profile]
schema-version = "1"
generator = "eggfetch-compat-profile"
version = "1"
created = "2026-07-21"
rebaselined = "2026-08-07"
rebaseline-sha = "f9eb1a455907d43210886b7b047d18bde8716652"
# Corrective 08 (post-hardening requalification and closure) renews the
# HTTPX 0.28.1 Stage C claim on the post-hardening executable SHA
# `d24101b...` after the focused post-hardening gate, Tier 1, extended,
# package validation, three consecutive pinned compatibility runs, the API
# oracle, and the required downstream portfolio all passed on the same
# SHA. Corrective 07's `5c7899f...` evidence is retained as historical
# only; its executable tree is superseded by 38 post-qualification
# hardening commits plus the Corrective 08 pre-freeze corrections
# (secret-redaction hardening, proxy EOF truncation boundary, package
# scanner false-positive exclusions, raw-stream Date determinism).
stage = "stage-c-qualified"
status = "stage-c-qualified"
qualification-sha = "d24101be6ed7be64463813750da5b4043d9905ec"
qualification-date = "2026-09-03"
historical-qualification-sha = "5c7899fefb6df087dfa1b3578fbef9ba64f87742, 9ffa6cd85848fd16a424b65f73254351911777c4, c44d4f25ffebc1a792335163ae4bc106076b3963"
reference = "httpx==0.28.1"

[reference]
distribution = "httpx"
version = "0.28.1"
python-versions = ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
sync-backend = "httpcore"
async-backend = "httpcore"

[eggfetch]
distribution = "eggfetch"
python-versions = ["3.10", "3.11", "3.12", "3.13"]
sync-backend = "rust-tokio"
async-backend = "rust-tokio"

[modules]
# Public modules included in the compatibility contract
public = ["httpx"]
# Private modules excluded (prefixed with _)
private-excluded = ["_transports", "_content", "_models", "_decoders", "_exceptions", "_multipart", "_urlparse", "_config"]

[feature-extras]
# HTTPX optional extras and their eggfetch equivalents
http2 = { httpx = "httpx[http2]", eggfetch = "http2=True" }
brotli = { httpx = "httpx[brotli]", eggfetch = "compression-brotli feature" }
zstd = { httpx = "httpx[zstd]", eggfetch = "compression-zstd feature" }
socks = { httpx = "httpx[socks]", eggfetch = "native Rust SOCKS5 (socks5/socks5h)" }

[compatibility-categories]
required-now = "Must match for current stage"
required-later = "Accepted gap assigned to later roadmap phase"
intentional-difference = "Reviewed and explicitly allowed"
not-public = "Excluded from contract"
not-applicable = "Reference feature cannot apply to current product stage"
resolved = "Previously required gap, now implemented and verified"
